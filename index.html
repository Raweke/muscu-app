/* ---------- image à partager ---------- */
async function shareImage(s){
  const T=themeVars(),W=1080,H=1350,c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
  const F='-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif';
  g.fillStyle=T.bg;g.fillRect(0,0,W,H);
  g.fillStyle=T.acbg;g.beginPath();g.arc(W-80,120,360,0,Math.PI*2);g.fill();
  g.fillStyle=T.acbg;g.beginPath();g.arc(60,H-80,300,0,Math.PI*2);g.fill();
  const rr=(x,y,w,h,r)=>{g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()};
  g.fillStyle=T.ac;g.font=`600 30px ${F}`;g.fillText('CARNET MUSCU',80,120);
  g.fillStyle=T.tx;g.font=`800 92px ${F}`;let tt=s.name;while(g.measureText(tt).width>920&&tt.length>4)tt=tt.slice(0,-2);if(tt!==s.name)tt+='…';g.fillText(tt,80,228);
  g.fillStyle=T.tx2;g.font=`400 36px ${F}`;const dd=fmtDayLong(s.date);g.fillText(dd.charAt(0).toUpperCase()+dd.slice(1),80,290);
  const st=[['Durée',fmtDur(s.end-s.start)],['Séries',String(sessSets(s))],['Volume',fmtK(sessVolume(s))+' kg']];
  st.forEach((v,i)=>{const x=80+i*313;rr(x,340,293,150,28);g.fillStyle=T.s2;g.fill();g.fillStyle=T.ac2;g.font=`500 28px ${F}`;g.fillText(v[0],x+28,392);g.fillStyle=T.tx;g.font=`700 46px ${F}`;g.fillText(v[1],x+28,458)});
  let y=570;const recs=new Set((s.records||[]).map(r=>r.ex));
  const done=s.items.filter(it=>it.sets.length),items=done.slice(0,9);
  items.forEach(it=>{const ty=it.type||exType(it);let best=it.sets[0];it.sets.forEach(x=>{if(ty==='charge'?e1rm(x.w,x.r)>e1rm(best.w,best.r):(x[keyField(ty)]||0)>(best[keyField(ty)]||0))best=x});
    const nm=exName(it);g.fillStyle=recs.has(nm)?T.gold:T.tx;g.font=`600 38px ${F}`;let n=nm;while(g.measureText(n).width>600&&n.length>4)n=n.slice(0,-2);if(n!==nm)n+='…';g.fillText(n,80,y);
    g.fillStyle=T.tx3;g.font=`400 28px ${F}`;g.fillText(it.sets.length+' séries',80,y+40);
    g.fillStyle=recs.has(nm)?T.gold:T.ac;g.font=`700 40px ${F}`;g.textAlign='right';g.fillText((recs.has(nm)?'★ ':'')+setTxt(ty,best),W-80,y+8);g.textAlign='left';
    g.strokeStyle=T.line;g.lineWidth=2;g.beginPath();g.moveTo(80,y+66);g.lineTo(W-80,y+66);g.stroke();y+=100});
  if(done.length>9){g.fillStyle=T.tx2;g.font=`400 30px ${F}`;g.fillText('+ '+(done.length-9)+' autres exercices',80,y+10)}
  const foot=[];if((s.records||[]).length)foot.push(s.records.length+' record'+(s.records.length>1?'s':''));if(s.rpe)foot.push('RPE '+s.rpe+'/10');if(s.mood!=null)foot.push(MOODS[s.mood][0]);
  if(foot.length){g.fillStyle=T.gold;g.font=`600 32px ${F}`;g.fillText(foot.join('  ·  '),80,H-80)}
  const blob=await new Promise(r=>c.toBlob(r,'image/png'));const name=`seance-${s.date}.png`;
  const file=new File([blob],name,{type:'image/png'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return}}catch(e){if(e.name==='AbortError')return}
  download(blob,name);
}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}

/* ---------- sauvegarde ---------- */
async function backup(){
  try{
    const zip=new JSZip();
    const data={app:'carnet-muscu',version:1,exported:new Date().toISOString(),exercises:S.exercises,templates:S.templates,plan:S.plan,planDates:S.planDates,planStamp:S.planStamp,settings:S.settings,sessions:S.sessions,game:G};
    zip.file('carnet-muscu.json',JSON.stringify(data));
    zip.file('LISEZMOI.txt','Sauvegarde Carnet Muscu du '+new Date().toLocaleString('fr-FR')+'\nPour restaurer : Réglages > Restaurer une sauvegarde, puis choisis ce fichier .zip.\n');
    const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE'});
    const name=`carnet-muscu-${dk(new Date())}.zip`,file=new File([blob],name,{type:'application/zip'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title:name})}catch(e){if(e.name==='AbortError')return;download(blob,name)}
    }else download(blob,name);
    S.settings.lastBackup=Date.now();save('settings');render();toast('Sauvegarde créée');
  }catch(e){toast('La sauvegarde a échoué')}
}
async function restore(file){
  try{
    let txt;
    if(/\.json$/i.test(file.name))txt=await file.text();
    else{const z=await JSZip.loadAsync(file);const f=Object.values(z.files).find(f=>/\.json$/i.test(f.name)&&!f.dir);if(!f)throw new Error('json');txt=await f.async('string')}
    const d=JSON.parse(txt);if(d.app!=='carnet-muscu'||!Array.isArray(d.sessions))throw new Error('format');
    if(!confirm(`Restaurer la sauvegarde du ${new Date(d.exported).toLocaleDateString('fr-FR')} ? (${d.sessions.filter(s=>s.done).length} séances) Les données actuelles seront remplacées.`))return;
    await DB.clear();
    S.exercises=d.exercises||[];S.templates=d.templates||[];S.plan=d.plan||{};S.planDates=d.planDates||{};S.planStamp=d.planStamp||{w:{},d:{}};S.settings={...DEF_SETTINGS,...(d.settings||{})};S.sessions=d.sessions;G={...G_DEF,...(d.game||{})};applyTheme(S.settings.theme);
    await Promise.all([save('exercises'),save('templates'),save('plan'),save('planDates'),save('planStamp'),saveG(),save('settings'),...S.sessions.map(s=>DB.put(s))]);
    render();toast('Sauvegarde restaurée');
  }catch(e){toast('Fichier non reconnu')}
}

/* appui long sur une icône : petite explication */
let tipT=null,tipXY=null,tipShown=false,tipH=null;
function showTip(el){const t=$('#tip');t.style.maxWidth=Math.min(270,innerWidth-24)+'px';t.textContent=el.dataset.tip;t.classList.add('on');
  const r=el.getBoundingClientRect(),tw=t.offsetWidth,th=t.offsetHeight;let x=r.left+r.width/2-tw/2;x=Math.max(12,Math.min(innerWidth-tw-12,x));let y=r.top-th-10;if(y<12)y=r.bottom+10;
  t.style.left=x+'px';t.style.top=y+'px';haptic();clearTimeout(tipH);tipH=setTimeout(()=>t.classList.remove('on'),2800)}
document.addEventListener('touchstart',e=>{clearTimeout(tipT);tipShown=false;const el=e.target.closest&&e.target.closest('[data-tip]');if(!el){$('#tip').classList.remove('on');return}
  tipXY=[e.touches[0].clientX,e.touches[0].clientY];tipT=setTimeout(()=>{tipShown=true;showTip(el)},450)},{passive:true,capture:true});
document.addEventListener('touchmove',e=>{if(!tipXY)return;const p=e.touches[0];if(Math.hypot(p.clientX-tipXY[0],p.clientY-tipXY[1])>10)clearTimeout(tipT)},{passive:true,capture:true});
document.addEventListener('touchend',e=>{clearTimeout(tipT);tipXY=null;if(tipShown&&e.cancelable)e.preventDefault()},{passive:false,capture:true});
document.addEventListener('click',e=>{if(tipShown){tipShown=false;e.stopPropagation();e.preventDefault()}},true);
document.addEventListener('contextmenu',e=>{if(e.target.closest&&e.target.closest('[data-tip]'))e.preventDefault()});

async function loadCards(){if(CARDS&&CARDS.length)return CARDS;try{const r=await fetch('jeu/cartes.json');CARDS=await r.json();CARDS.forEach(c=>CARDMAP[c.id]=c)}catch(e){CARDS=[]}await loadSecrets();return CARDS}
/* cartes privées : chiffrées (AES-GCM, clé PBKDF2) dans jeu/s.json, lisibles seulement avec le code saisi dans Réglages */
const secNorm=x=>String(x||'').toLowerCase().replace(/[\s\-]/g,'');
async function secOpen(code){const r=await fetch('jeu/s.json',{cache:'no-cache'});if(!r.ok)throw new Error('net');const j=await r.json(),T=new TextEncoder(),b=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
  const km=await crypto.subtle.importKey('raw',T.encode(secNorm(code)),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(j.s),iterations:j.i,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  let p;try{p=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(j.iv)},k,b(j.d))}catch(e){throw new Error('code')}return JSON.parse(new TextDecoder().decode(p))}
function secAdd(o){o.cards.forEach(c=>{c.src='data:image/jpeg;base64,'+o.img[c.id];c.silsrc='data:image/png;base64,'+o.sil[c.id];if(CARDMAP[c.id]){Object.assign(CARDMAP[c.id],c);return}CARDS.push(c);CARDMAP[c.id]=c})}

/* ---- récompenses (calculées depuis l'historique) ---- */
function sessComplete(s){if(s.complete!=null)return s.complete;if(s.items.some(it=>it.skipped))return false;const t=tplById(s.templateId);if(!t)return true;
  return t.items.every(ti=>{const it=s.items.find(i=>i.exId===ti.exId);return it&&it.sets.filter(x=>x.done).length>=(ti.sets||1)})}
function sessAhead(s){if(s.ahead!=null)return s.ahead;const t=planFor(s.date);return !!(t&&t.id===s.templateId)}
function sessReward(s){const c=sessComplete(s),a=c&&sessAhead(s),rec=Math.min(3,(s.records||[]).length);return {c,a,rec,pts:(a?100:c?70:40)+rec*15,boost:a?3:c?2:1}}
const LVL_NAMES=[[40,'Légende'],[30,'Grand maître'],[25,'Maître'],[20,'Champion'],[15,'Guerrier'],[10,'Combattant'],[5,'Apprenti'],[1,'Novice']];
const lvlNeed=n=>50*n*(n-1);
function levelOf(xp){let n=1;while(xp>=lvlNeed(n+1))n++;return {n,name:LVL_NAMES.find(x=>n>=x[0])[1],cur:xp-lvlNeed(n),need:lvlNeed(n+1)-lvlNeed(n)}}
function bestPerDay(){const by={};doneSess().forEach(s=>{const r=sessReward(s);if(!by[s.date]||r.pts>by[s.date].r.pts)by[s.date]={s,r}});return by}
function weekList(){const f=doneSess()[0];if(!f)return [];const out=[],end=weekStart(new Date());for(let w=weekStart(fromDk(f.date));w<=end;w=addDays(w,7))out.push(w);return out}
function weekDone(ws){const W=weekStats(ws);const days=new Set(W.done.map(s=>s.date));return W.planned>0&&days.size>=W.planned}
function statsAll(){
  const ds=doneSess(),by=bestPerDay();
  let vol=0,recs=0,early=0,late=0,big=0;ds.forEach(s=>{const v=sessVolume(s);vol+=v;if(v>=10000)big++;recs+=(s.records||[]).length;const h=new Date(s.start).getHours();if(!s.past&&h<7)early++;if(!s.past&&h>=21)late++});
  const days=Object.keys(by).sort();let run=1,maxRun=days.length?1:0;for(let i=1;i<days.length;i++){run=daysBetween(days[i-1],days[i])===1?run+1:1;maxRun=Math.max(maxRun,run)}
  let ws=0,maxWs=0;weekList().forEach(w=>{ws=weekDone(w)?ws+1:0;maxWs=Math.max(maxWs,ws)});
  const ahead=Object.values(by).filter(x=>x.r.a).length;
  const own=Object.keys(G.cards);const cnt=r=>own.filter(id=>CARDMAP[id]&&CARDMAP[id].r===r).length;
  const fr=own.filter(id=>CARDMAP[id]&&CARDMAP[id].c==='FR').length;
  return {n:days.length,vol,recs,early,late,big,maxRun,maxWs,ahead,own:own.length,leg:cnt('legendaire'),myth:cnt('mythique'),fr};
}

function weekMissions(ws){const o=weekMissions0(ws);return ws.getTime()<PG_FROM?o.map(m=>m[0]==='pg'?M9_OLD:m):o}
function weekMissions0(ws){let seed=Math.floor(ws.getTime()/6048e5);const pool=MISSIONS.slice(),out=[];
  const easy=pool.splice(seed%2,1)[0];out.push(easy);
  while(out.length<3){seed=(seed*9301+49297)%233280;const i=seed%pool.length;const m=pool.splice(i,1)[0];if(m[0]==='s3'||m[0]==='s4')continue;out.push(m)}return out}
function weekFacts(ws){const we=addDays(ws,7);const ss=doneSess().filter(s=>{const d=fromDk(s.date);return d>=ws&&d<we});const by={};ss.forEach(s=>{const r=sessReward(s);if(!by[s.date]||r.pts>by[s.date].r.pts)by[s.date]={s,r}});
  const ds=Object.keys(by).sort();let consec=0;for(let i=1;i<ds.length;i++)if(daysBetween(ds[i-1],ds[i])===1)consec=1;
  return {days:ds.length,comp:Object.values(by).filter(x=>x.r.c).length,ahead:Object.values(by).filter(x=>x.r.a).length,recs:ss.reduce((a,s)=>a+(s.records||[]).length,0),

function weekProg(ss){const all=doneSess(),mx=(its,id)=>Math.max(0,...its.filter(j=>j.exId===id&&exType(j)==='charge').flatMap(j=>j.sets.filter(x=>x.done).map(x=>+x.w||0)));let n=0;
  ss.forEach(s=>{const seen=new Set();s.items.forEach(i=>{if(exType(i)!=='charge'||seen.has(i.exId))return;seen.add(i.exId);const w=mx(s.items,i.exId);if(!w)return;
    let prev=null;for(const p of all){if(p.start>=s.start)break;if(mx(p.items,i.exId))prev=p}if(prev&&w>mx(prev.items,i.exId))n++})});return n}

  await loadCards();const c=CARDMAP[id];if(!c)return;const isNew=!G.cards[c.id];if(isNew){G.cards[c.id]=Date.now();saveG()}
  const o=$('#gopen');o.className='on dark sec';document.documentElement.classList.add('gnoscroll');
  o.innerHTML=`<div class="rays" id="grays"></div><div class="glitch" id="ggl"></div><canvas id="gfx"></canvas><div class="flashw" id="gflash"></div><div class="stage" id="gst"></div>`;
  fxInit($('#gfx'));const st=$('#gst');let phase='intro',busy=true;
  const SC=['#b9a6ff','#6b5bff','#00e0c6','#ff3df0','#ffffff'];
  const flash=c=>{const f=$('#gflash');f.style.background=c;f.classList.remove('go');void f.offsetWidth;f.classList.add('go')};
  st.innerHTML=`<div class="sintro">Une carte secrète se débloque</div>
    <div class="cwrap enter"><div class="fc big flip r-secret tease-secret" id="gcard"><div class="in">${cardFace(c)}<div class="bk"><div class="sk cbk sbk"><div class="seye">?</div></div></div></div></div></div>
    <div class="lbl" id="glbl"></div><div class="hint" id="ghint"></div>`;
  haptic();setTimeout(()=>{busy=false;phase='hidden';$('#ghint').textContent='Touche pour révéler'},1400);
  o.onclick=e=>{if(busy)return;
    if(phase==='hidden'){busy=true;$('#ghint').textContent='';const card=$('#gcard');card.classList.add('charge3');$('#ggl').classList.add('on');$('#grays').className='rays on r-secret';haptic();
      setTimeout(()=>{haptic();flash('#b9a6ff')},900);setTimeout(()=>haptic(),1500);
      setTimeout(()=>{card.classList.remove('charge3');$('#ggl').classList.remove('on');card.classList.add('reveal');card.classList.remove('flip');flash('#fff');haptic();
        const b=card.getBoundingClientRect(),cx=b.left+b.width/2,cy=b.top+b.height/2;fxBurstAt(cx,cy,SC,200,1.6);
        setTimeout(()=>fxBurstAt(cx,cy-80,SC,120,1.2),300);setTimeout(()=>fxBurstAt(cx,cy+60,SC,90,1),650);
        const l=$('#glbl');l.className='lbl pop new';l.textContent=isNew?'CARTE SECRÈTE · DÉBLOQUÉE':'Carte secrète déjà obtenue';
        setTimeout(()=>{const bk=card.querySelector('.in > .bk');if(bk)bk.outerHTML=cardBack(c);$('#ghint').textContent='Touche la carte pour la retourner, ailleurs pour fermer';busy=false;phase='shown'},1000)},2100);return}
    if(phase==='shown'){const fc=e.target.closest('.fc');if(fc){fc.classList.toggle('flip');return}
      o.className='';o.onclick=null;FX=null;o.innerHTML='';document.documentElement.classList.remove('gnoscroll');drawGame();render()}};
}
/* effets de validation */
/* effets de validation d'une série : étincelles, flammes, confettis */
let VFX=null;
function vfxCanvas(){if(VFX&&document.body.contains(VFX.cv))return VFX;const cv=document.createElement('canvas');cv.className='vfx';document.body.appendChild(cv);
  const dpr=Math.min(2,devicePixelRatio||1);cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;const g=cv.getContext('2d');g.scale(dpr,dpr);VFX={cv,g,p:[],run:false};return VFX}
const THFX=['fp1','fp2','tisseur','justicier','stade','shinobi','dojo','ring','aura','armure','arcade'];
function vEl(cls,html,x,y,ms){const e=document.createElement('div');e.className='vfxe '+cls;e.innerHTML=html||'';e.style.left=x+'px';e.style.top=y+'px';document.body.appendChild(e);setTimeout(()=>e.remove(),ms);return e}
function fxBurst(el){if(!G.on||!el)return;const th=S.settings.theme;if(!THFX.includes(th))return;const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,V=vfxCanvas();
  const P=o=>V.p.push(o);
  if(th==='tisseur'){P({t:'web',x:cx,y:cy,life:1,dec:.018,R:Math.min(150,innerWidth*.4),a0:Math.random()*6});}
  else if(th==='justicier'){vEl('vbeam','',cx,cy,900);vEl('vbat','',cx,cy,1100)}
  else if(th==='stade'){vEl('vball','',cx,cy,1000);vEl('vtag','+1',cx,r.top,1100)}
  else if(th==='shinobi'){for(let k=0;k<22;k++){const a=Math.random()*6.28,sp=.6+Math.random()*2.2;P({t:'smk',x:cx+(Math.random()-.5)*r.width*.6,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp*.5-.5,life:.8,dec:.014+Math.random()*.01,s:10+Math.random()*14})}vEl('vshuri','',cx,cy,900)}
  else if(th==='dojo'){for(let k=0;k<26;k++){const a=-Math.PI/2+(Math.random()-.5)*2.4,sp=2+Math.random()*5;P({t:'pet',x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,rot:Math.random()*6,vr:(Math.random()-.5)*.2,fl:Math.random()*6,life:1,dec:.008+Math.random()*.005,s:4+Math.random()*3})}vEl('vhanko','',r.right-10,r.top,900)}
  else if(th==='ring'){el.classList.remove('vhit');void el.offsetWidth;el.classList.add('vhit');setTimeout(()=>el.classList.remove('vhit'),500);vEl('vding','DING',cx,r.top,900);vEl('vstars','<i>★</i><i>★</i><i>★</i>',cx,r.top,1000)}
  else if(th==='aura'){for(let k=0;k<40;k++){const a=Math.random()*6.28,sp=2+Math.random()*6;P({t:'au',x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1.5,life:1,dec:.025+Math.random()*.02,s:3+Math.random()*5})}for(let k=0;k<3;k++)P({t:'bolt',x:cx,y:cy,a:-Math.PI/2+(Math.random()-.5)*2.2,L:60+Math.random()*60,life:1,dec:.06,seed:Math.random()});
    el.classList.remove('vaura');void el.offsetWidth;el.classList.add('vaura');setTimeout(()=>el.classList.remove('vaura'),1100)}
  else if(th==='armure'){vEl('vbeam2','',cx,r.top,700);vEl('vring','',cx,cy,800);vEl('vhud','SÉRIE OK',cx,r.top,1100)}
  else if(th==='fp1'||th==='fp2'){vEl('vbar','',cx,cy,1000);setTimeout(()=>{const W=vfxCanvas();for(let k=0;k<34;k++){const a=Math.random()*6.28,sp=3+Math.random()*7;W.p.push({t:'s',x:cx,y:cy-150,px:cx,py:cy-150,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,dec:.03+Math.random()*.02,w:1.4+Math.random()*1.6,yel:1})}if(!W.run){W.run=true;requestAnimationFrame(vfxLoop)}},560)}
  else if(th==='arcade'){for(let k=0;k<6;k++){const e=vEl('vcoin','',cx,cy,900);e.style.setProperty('--dx',((k-2.5)*22)+'px');e.style.setProperty('--dy',(-60-Math.random()*40)+'px');e.style.animationDelay=(k*40)+'ms'}vEl('vplus','+1',cx,r.top,1000)}
  if(V.p.length&&!V.run){V.run=true;requestAnimationFrame(vfxLoop)}else if(!V.p.length){V.cv.remove();VFX=null}}
function vfxLoop(){const V=VFX;if(!V)return;const g=V.g;g.clearRect(0,0,innerWidth,innerHeight);
  V.p=V.p.filter(q=>q.life>0);
  for(const q of V.p){
    if(q.t==='s'){q.px=q.x;q.py=q.y;q.vy+=.28;q.vx*=.98;q.x+=q.vx;q.y+=q.vy;q.life-=q.dec;
      g.globalCompositeOperation='lighter';const a=Math.max(0,q.life);g.strokeStyle=q.yel?(a>.5?`rgba(255,250,170,${a})`:`rgba(255,225,0,${a})`):a>.6?`rgba(255,255,230,${a})`:a>.3?`rgba(255,210,90,${a})`:`rgba(255,120,30,${a})`;
      g.lineWidth=q.w;g.lineCap='round';g.beginPath();g.moveTo(q.px-q.vx*1.5,q.py-q.vy*1.5);g.lineTo(q.x,q.y);g.stroke()}
    else if(q.t==='f'){q.life-=q.dec;g.globalCompositeOperation='lighter';const gr=g.createRadialGradient(q.x,q.y,0,q.x,q.y,q.r*(2-q.life));gr.addColorStop(0,`rgba(255,250,210,${q.life*.9})`);gr.addColorStop(1,'rgba(255,180,60,0)');g.fillStyle=gr;g.beginPath();g.arc(q.x,q.y,q.r*(2-q.life),0,7);g.fill()}
    else if(q.t==='fl'){if(q.del>0){q.del--;continue}q.ph+=.3;q.x+=q.vx+Math.sin(q.ph)*.5;q.y+=q.vy;q.vy*=.99;q.life-=q.dec;const L=Math.max(0,q.life),R=q.s*(.4+L*.8);
      g.globalCompositeOperation='lighter';const gr=g.createRadialGradient(q.x,q.y,0,q.x,q.y,R);
      gr.addColorStop(0,L>.6?`rgba(255,245,200,${L*.9})`:`rgba(255,200,80,${L*.8})`);gr.addColorStop(.45,`rgba(255,${Math.round(90+L*80)},20,${L*.6})`);gr.addColorStop(1,'rgba(200,30,0,0)');
      g.fillStyle=gr;g.beginPath();g.ellipse(q.x,q.y,R*.6,R*(1.2+(1-L)*.8),0,0,7);g.fill()}
    else if(q.t==='web'){q.life-=q.dec;const k=Math.min(1,(1-q.life)*3),R=q.R*k,al=Math.min(1,q.life*1.5);g.globalCompositeOperation='source-over';g.strokeStyle=`rgba(255,255,255,${al*.9})`;g.lineWidth=1.3;
      const n=10;g.beginPath();for(let i=0;i<n;i++){const a=q.a0+i/n*6.283;g.moveTo(q.x,q.y);g.lineTo(q.x+Math.cos(a)*R,q.y+Math.sin(a)*R)}
      for(const f of [.3,.55,.8,1]){for(let i=0;i<n;i++){const a1=q.a0+i/n*6.283,a2=q.a0+(i+1)/n*6.283,rr=R*f,mx=q.x+Math.cos((a1+a2)/2)*rr*.86,my=q.y+Math.sin((a1+a2)/2)*rr*.86;g.moveTo(q.x+Math.cos(a1)*rr,q.y+Math.sin(a1)*rr);g.quadraticCurveTo(mx,my,q.x+Math.cos(a2)*rr,q.y+Math.sin(a2)*rr)}}g.stroke()}
    else if(q.t==='smk'){q.x+=q.vx;q.y+=q.vy;q.vx*=.96;q.vy*=.96;q.s+=.6;q.life-=q.dec;g.globalCompositeOperation='source-over';const gr=g.createRadialGradient(q.x,q.y,0,q.x,q.y,q.s);gr.addColorStop(0,`rgba(220,220,230,${Math.max(0,q.life)*.5})`);gr.addColorStop(1,'rgba(220,220,230,0)');g.fillStyle=gr;g.beginPath();g.arc(q.x,q.y,q.s,0,7);g.fill()}
    else if(q.t==='pet'){q.vy+=.08;q.vx*=.97;q.vy=Math.min(q.vy,1.6);q.fl+=.12;q.x+=q.vx+Math.sin(q.fl)*.8;q.y+=q.vy;q.rot+=q.vr;q.life-=q.dec;g.globalCompositeOperation='source-over';g.globalAlpha=Math.min(1,q.life*2);g.save();g.translate(q.x,q.y);g.rotate(q.rot);g.scale(1,Math.abs(Math.cos(q.fl))*.6+.4);g.fillStyle='#ffb7c9';g.beginPath();g.ellipse(0,0,q.s,q.s*.6,0,0,7);g.fill();g.restore();g.globalAlpha=1}
    else if(q.t==='au'){q.x+=q.vx;q.y+=q.vy;q.vx*=.95;q.vy*=.95;q.vy-=.05;q.life-=q.dec;g.globalCompositeOperation='lighter';const L=Math.max(0,q.life),gr=g.createRadialGradient(q.x,q.y,0,q.x,q.y,q.s*2);gr.addColorStop(0,`rgba(255,250,200,${L})`);gr.addColorStop(.5,`rgba(255,190,0,${L*.6})`);gr.addColorStop(1,'rgba(255,120,0,0)');g.fillStyle=gr;g.beginPath();g.arc(q.x,q.y,q.s*2,0,7);g.fill()}
    else if(q.t==='bolt'){q.life-=q.dec;g.globalCompositeOperation='lighter';g.strokeStyle=`rgba(255,240,150,${Math.max(0,q.life)})`;g.lineWidth=2;g.shadowColor='#ffb000';g.shadowBlur=10;g.beginPath();g.moveTo(q.x,q.y);let px=q.x,py=q.y;const st=6;for(let i=1;i<=st;i++){const d=q.L*i/st,j=((Math.sin(q.seed*99+i*7.3)))*10;px=q.x+Math.cos(q.a)*d+Math.cos(q.a+1.57)*j;py=q.y+Math.sin(q.a)*d+Math.sin(q.a+1.57)*j;g.lineTo(px,py)}g.stroke();g.shadowBlur=0}
    else if(q.t==='c'){q.vy+=.16;q.vx*=.96;q.vy*=.96;q.vy=Math.min(q.vy,3.2);q.x+=q.vx+Math.sin(q.fl)*.6;q.y+=q.vy;q.rot+=q.vr;q.fl+=q.vf;q.life-=q.dec;
      g.globalCompositeOperation='source-over';g.globalAlpha=Math.min(1,q.life*2);g.save();g.translate(q.x,q.y);g.rotate(q.rot);g.scale(1,Math.cos(q.fl));g.fillStyle=q.c;g.fillRect(-q.w/2,-q.h/2,q.w,q.h);g.restore();g.globalAlpha=1}
  }
  g.globalCompositeOperation='source-over';
  if(V.p.length)requestAnimationFrame(vfxLoop);else{V.run=false;V.cv.remove();VFX=null}}
/* activation */
async function gameActivate(){G.on=true;G.userOff=false;if(!G.activatedAt){G.activatedAt=Date.now();G.timerLast=Date.now();
    for(const s of doneSess()){if(s.complete==null||s.ahead==null){s.complete=sessComplete(s);s.ahead=sessAhead(s);await saveSess(s)}}}
  saveG();await loadCards()}
async function gameToggle(){
  if(G.on){if(!confirm('Désactiver le mode jeu ? Le niveau et le bouton du jeu ne s’afficheront plus. Ta collection et tes points sont gardés, tu pourras le réactiver.'))return;G.on=false;G.userOff=true;saveG();render();toast('Mode jeu désactivé');return}
  await gameActivate();render();
  const R=rewards();
  const body=openSheet(`<h3>Mode jeu activé</h3><p class="muted" style="line-height:1.55;margin:0 0 10px">Entraîne-toi pour gagner des <b>points</b>, monter de <b>niveau</b> et ouvrir des <b>boosters</b> de 10 cartes. Le but : collectionner plus de 250 combattants.</p>
    <p class="muted" style="line-height:1.55;margin:0 0 14px">Tes séances passées comptent déjà : tu démarres au <b>niveau ${R.lvl.n}</b> avec <b>${stock(R).total} boosters</b>, dont 10 de bienvenue. Le mode jeu s’ouvre avec le bouton en haut de l’accueil.</p>
    <div class="stick"><button class="btn grow" data-x="go">Ouvrir le mode jeu</button></div>`);
  body.addEventListener('click',e=>{if(e.target.closest('[data-x="go"]')){closeSheet();gameOpen('boost')}});
}
function rewardLine(s){if(!G.on)return '';const r=sessReward(s),by=bestPerDay()[s.date],best=by&&by.s.id===s.id;
  return `<div class="rew"><span style="color:var(--ac)">${ic('cards')}</span><div class="grow"><b>${best?'+'+r.pts+' pts · +'+r.boost+' booster'+(r.boost>1?'s':''):'Déjà une séance comptée aujourd’hui'}</b><div class="small muted">${best?(r.a?'Séance prévue et finie':r.c?'Séance finie mais non prévue':'Séance pas terminée')+(r.rec?' · '+r.rec+' record'+(r.rec>1?'s':''):''):'Une seule séance par jour compte : la meilleure.'}</div></div><button class="btn sm" data-x="game">Ouvrir</button></div>`}
function newsSheet(onlyLatest){const list=onlyLatest?CHANGELOG.slice(0,1):CHANGELOG;
  const body=openSheet(`<h3>Nouveautés</h3>${list.map(c=>`<div class="h2" style="margin-top:6px">Version ${c.v}</div><div class="card list">${c.items.map(t=>`<div class="li"><span style="color:var(--ac)">${ic('check','s')}</span><div class="grow" style="line-height:1.45">${t}</div></div>`).join('')}</div>`).join('')}
    ${onlyLatest?`<button class="btn ghost full" style="margin-top:8px" data-x="all">Voir les versions précédentes</button>`:''}<div class="stick"><button class="btn grow" data-x="ok">Compris</button></div>`);
  body.addEventListener('click',e=>{const x=e.target.closest('[data-x]');if(!x)return;closeSheet();if(x.dataset.x==='all')newsSheet(false)});
}

function creditsSheet(){const L=CARDS.filter(c=>c.img&&c.r!=='secret').sort((a,b)=>a.n.localeCompare(b.n));
  openSheet(`<h3>Crédits</h3><p class="small muted" style="line-height:1.5">Photos : Wikimedia Commons, sous licences libres. Textes : Wikipédia (CC BY-SA).</p><div class="card list">${L.map(c=>`<div class="li"><div class="grow"><div style="font-weight:600">${esc(c.n)}</div><div class="tiny dim">${esc(c.pa||'Auteur inconnu')}${c.pl?' · '+esc(c.pl):''}</div></div></div>`).join('')}</div>`)}
function shortName(n){n=String(n||'').trim();if(n.length<=7)return n;const w=n.split(/[\s\-–·/]+/).filter(x=>x&&!/^(de|du|des|et|la|le)$/i.test(x));
  if(w.length>=2)return w.slice(0,3).map(x=>x[0].toUpperCase()).join('');return n.slice(0,6)+'.'}

/* fluidité : seules les cartes de la collection visibles à l'écran sont animées */
(function(){if(!('IntersectionObserver' in window))return;
  const io=new IntersectionObserver(es=>es.forEach(e=>e.target.classList.toggle('vis',e.isIntersecting)),{rootMargin:'80px'});
  const scan=root=>{(root.querySelectorAll?root:document).querySelectorAll('.cgrid .fc:not(.lzf)').forEach(f=>{f.classList.add('lzf');io.observe(f)})};
  new MutationObserver(ms=>{for(const m of ms)if(m.addedNodes.length){scan(document);break}}).observe(document.body,{childList:true,subtree:true});
})();
/* ---------- démarrage ---------- */
(async function boot(){
  try{
    await DB.open();
    const ex=await DB.get('exercises');
    if(!ex){seed();await Promise.all([save('exercises'),save('templates'),save('plan'),save('settings')])}
    else{S.exercises=ex;S.templates=(await DB.get('templates'))||[];S.plan=(await DB.get('plan'))||{};S.planDates=(await DB.get('planDates'))||{};S.planStamp=(await DB.get('planStamp'))||{w:{},d:{}};G={...G_DEF,...((await DB.get('game'))||{})};S.settings={...DEF_SETTINGS,...((await DB.get('settings'))||{})}}
    S.sessions=(await DB.all())||[];
  }catch(e){seed();toast('Stockage indisponible : les données ne seront pas conservées')}
  if(!S.settings.since){S.settings.since=dk(new Date());save('settings')}
  applyTheme(S.settings.theme);
  if(!G.on&&!G.userOff)await gameActivate();
  if(G.on){await loadCards();tickTimer()}
  render();
  if(!S.settings.seenGuide){openGuide();S.settings.seenVersion=APP_VERSION;save('settings')}
  else if(S.settings.seenVersion!==APP_VERSION){S.settings.seenVersion=APP_VERSION;save('settings');setTimeout(()=>newsSheet(true),400)}
  setInterval(()=>{if(!G.on)return;tickTimer();if(tab==='home'&&!$('#game').classList.contains('on'))render();else if($('#game').classList.contains('on')&&gTab==='boost'&&!$('#gopen').classList.contains('on'))drawGame()},60000);
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
