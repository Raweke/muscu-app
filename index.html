<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Carnet Muscu">
<meta name="theme-color" content="#120f1f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Carnet Muscu</title>
<style>
:root{
  --bg:#120f1f;--s1:#1a1630;--s2:#221c3d;--s3:#2c2550;--line:#2f2852;
  --tx:#ece8ff;--tx2:#a49cc8;--tx3:#726a99;
  --ac:#b56bff;--ac2:#a796ff;--acbg:rgba(181,107,255,.15);--acline:rgba(181,107,255,.45);--ink:#140d24;--bgt:rgba(18,15,31,.94);--bgs:rgba(18,15,31,.55);
  --gold:#ffcf5c;--goldbg:rgba(255,207,92,.14);--red:#ff6b81;--redbg:rgba(255,107,129,.13);--ok:#7ef0c3;
  --sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;font-size:16px;-webkit-text-size-adjust:100%}
body{min-height:100vh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
input,select,textarea{background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
select{background-image:linear-gradient(45deg,transparent 50%,var(--tx2) 50%),linear-gradient(135deg,var(--tx2) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
textarea{min-height:80px;resize:vertical}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s{width:18px;height:18px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--tx2)}.dim{color:var(--tx3)}
.small{font-size:13px}.tiny{font-size:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#top{position:sticky;top:0;z-index:20;padding:calc(var(--sat) + 14px) 18px 10px;background:var(--bgt);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
#top h1{margin:0;font-size:30px;font-weight:700;letter-spacing:-.5px}
#top .sub{color:var(--ac2);font-size:13px;margin-bottom:2px;text-transform:capitalize}
#view{padding:6px 16px calc(96px + var(--sab))}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;padding:8px 6px calc(8px + var(--sab));background:var(--bgt);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--tx3);font-size:11px;padding:4px 0}
#tabs button.on{color:var(--ac)}

.card{background:var(--s1);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card.tight{padding:10px 12px}
.h2{font-size:13px;color:var(--ac2);text-transform:uppercase;letter-spacing:.8px;margin:20px 4px 8px;font-weight:600}
.h2:first-child{margin-top:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:23px;background:var(--ac);color:var(--ink);font-weight:600;font-size:16px}
.btn.full{width:100%}
.btn.sec{background:var(--s2);color:var(--tx);border:1px solid var(--line)}
.btn.ghost{background:transparent;color:var(--ac2);border:1px solid var(--acline)}
.btn.danger{background:var(--redbg);color:var(--red)}
.btn.sm{height:36px;padding:0 14px;font-size:14px;border-radius:18px}
.btn:active{transform:scale(.97)}
.ibtn{width:38px;height:38px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--tx2);background:var(--s2)}
.ibtn.ac{color:var(--ac);background:var(--acbg)}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:16px;background:var(--s2);color:var(--tx2);font-size:14px;white-space:nowrap;border:1px solid transparent}
.chip.on{background:var(--acbg);color:var(--tx);border-color:var(--acline)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:10px;background:var(--acbg);color:var(--ac2);font-weight:600}
.badge.gold{background:var(--goldbg);color:var(--gold)}
.badge.red{background:var(--redbg);color:var(--red)}
.seg{display:flex;background:var(--s1);border-radius:14px;padding:4px;margin:4px 0 14px}
.seg button{flex:1;height:36px;border-radius:10px;color:var(--tx2);font-size:14px;font-weight:500}
.seg button.on{background:var(--s3);color:var(--tx)}
.list .li{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
.list .li:last-child{border-bottom:0}
.empty{text-align:center;color:var(--tx2);padding:28px 10px}
.empty b{display:block;color:var(--tx);font-size:17px;margin-bottom:6px}
.dot{width:8px;height:8px;border-radius:50%;flex:none}

.today{border-radius:20px;padding:18px;background:var(--s2);position:relative;overflow:hidden;margin-bottom:12px}
.today .lab{font-size:13px;color:var(--ac2)}
.today .ttl{font-size:26px;font-weight:700;margin:4px 0 6px;letter-spacing:-.3px}
.today .bar{position:absolute;left:0;top:0;bottom:0;width:5px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{background:var(--s1);border-radius:12px;padding:8px 2px;text-align:center;min-height:82px;display:flex;flex-direction:column;align-items:center;gap:4px;border:1px solid transparent}
.wd.today{border-color:var(--ac)}
.wd .d1{font-size:11px;color:var(--tx3)}
.wd .d2{font-size:16px;font-weight:600}
.wd .pl{font-size:10px;line-height:1.2;color:var(--tx2);max-width:100%;padding:0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wd .st{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-top:auto}
.wd .st svg{width:12px;height:12px;stroke-width:3}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:var(--s1);border-radius:var(--r);padding:12px 14px}
.tile .v{font-size:24px;font-weight:700;margin-top:2px}
.tile .v small{font-size:13px;color:var(--tx2);font-weight:500}
.banner{display:flex;align-items:center;gap:12px;background:var(--acbg);border:1px solid var(--acline);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.banner.warn{background:var(--goldbg);border-color:rgba(255,207,92,.35)}

.tpl{display:flex;gap:12px;align-items:center;background:var(--s1);border-radius:var(--r);padding:14px;margin-bottom:10px;position:relative;overflow:hidden}
.tpl .bar{position:absolute;left:0;top:0;bottom:0;width:4px}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .hd{font-size:11px;color:var(--tx3);text-align:center;padding:4px 0}
.cal .c{aspect-ratio:1/1.08;border-radius:10px;background:var(--s1);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;gap:4px;font-size:14px;border:1px solid transparent}
.cal .c.out{background:transparent}
.cal .c.td{border-color:var(--ac)}
.cal .c .ds{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;padding:0 2px}
.cal .c .ds i{width:7px;height:7px;border-radius:50%;display:block}
.cal .c .ds i.pl{background:transparent;border:1.5px solid var(--tx3)}
.cal .c .ds i.ms{background:transparent;border:1.5px solid var(--red)}

.bars .b{margin:10px 0}
.bars .track{height:10px;background:var(--s2);border-radius:5px;overflow:hidden;margin-top:5px}
.bars .fill{height:100%;background:var(--ac);border-radius:5px}

/* sheets */
.sheet-wrap{position:fixed;inset:0;z-index:100}
.sheet-bg{position:absolute;inset:0;background:rgba(5,3,12,.6);opacity:0;transition:opacity .22s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:calc(100% - var(--sat) - 56px);background:var(--s1);border-radius:22px 22px 0 0;transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-bottom:var(--sab)}
.sheet-wrap.in .sheet-bg{opacity:1}
.sheet-wrap.in .sheet{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--s3);margin:8px auto 2px;flex:none}
.sheet.drag{transition:none}
.sheet-top{flex:none;padding:4px 0 8px;touch-action:none;cursor:grab}
.sheet-x{position:absolute;top:10px;right:12px;z-index:2;width:34px;height:34px;border-radius:50%;background:var(--s2);color:var(--tx2);display:flex;align-items:center;justify-content:center;border:0;padding:0}
.sheet-x svg{width:16px;height:16px}
.sheet-body>:first-child{padding-right:40px}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:8px 16px 20px}
.sheet h3{margin:6px 0 12px;font-size:22px;letter-spacing:-.3px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--tx2);margin:0 0 6px 2px}
.sheet .opt{display:flex;align-items:center;gap:12px;padding:13px 12px;border-radius:12px;background:var(--s2);margin-bottom:8px;width:100%;text-align:left}
.sheet .opt.on{background:var(--acbg);outline:1px solid var(--acline)}
.stick{position:sticky;bottom:-20px;background:var(--s1);padding:12px 0 6px;margin-top:8px;display:flex;gap:10px}
.sw{width:50px;height:30px;border-radius:15px;background:var(--s3);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--ac)}
.sw.on::after{transform:translateX(20px)}
.colors{display:flex;gap:10px}
.colors button{width:34px;height:34px;border-radius:50%;border:3px solid transparent}
.colors button.on{border-color:var(--tx)}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.th{border-radius:14px;padding:10px 8px 9px;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--tx2)}
.th.on{border-color:var(--ac);color:var(--tx)}
.th .sq{width:100%;height:40px;border-radius:10px;display:flex;align-items:flex-end;padding:6px;gap:4px;border:1px solid rgba(255,255,255,.08)}
.th .sq i{height:8px;border-radius:4px;display:block}
.wd.ov .pl{text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px}
.it{background:var(--s2);border-radius:14px;padding:10px 12px;margin-bottom:8px;position:relative}
.it.ssl{border-left:3px solid var(--ac);border-radius:0 14px 14px 0}
.step{display:flex;align-items:center;background:var(--s3);border-radius:10px;height:34px}
.step button{width:30px;height:34px;color:var(--ac2);font-size:20px}
.step span{min-width:30px;text-align:center;font-weight:600;font-size:15px}
.mini{font-size:11px;color:var(--tx3);margin-bottom:3px}

/* live */
#live{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;flex-direction:column}
#live.on{display:flex}
.lv-h{padding:calc(var(--sat) + 8px) 12px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);background:var(--bg)}
.lv-h .t{flex:1;min-width:0;text-align:center}
.lv-h .t b{display:block;font-size:17px}
.lv-h .t span{font-size:13px;color:var(--ac2)}
.lv-b{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px calc(120px + var(--sab))}
.ex{background:var(--s1);border-radius:18px;padding:12px 12px 10px;margin-bottom:12px}
.ex.ss{border-left:4px solid var(--ac);border-radius:6px 18px 18px 6px;margin-bottom:6px}
.ex.ss.last{margin-bottom:14px}
.ex-h{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px}
.ex-h .n{font-size:17px;font-weight:650;line-height:1.25}
.prevl{font-size:12px;color:var(--tx3);margin:0 0 8px}
.sets{display:grid;gap:6px}
.sr{display:grid;align-items:center;gap:6px;padding:4px;border-radius:12px}
.sr.hd{font-size:11px;color:var(--tx3);padding:0 4px;text-transform:uppercase;letter-spacing:.5px}
.sr.done{background:var(--acbg)}
.sr .k{width:26px;height:26px;border-radius:8px;background:var(--s2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--tx2)}
.sr.done .k{background:var(--ac);color:var(--ink)}
.sr .k.pr{background:var(--gold);color:#2a1f00}
.sr .pv{font-size:12px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell{height:40px;text-align:center;padding:0 4px;font-weight:600;font-size:17px;background:var(--s2);border-radius:10px;font-variant-numeric:tabular-nums}
.sr.done .cell{background:var(--bgs);border-color:transparent}
.ck{width:40px;height:40px;border-radius:12px;background:var(--s2);display:flex;align-items:center;justify-content:center;color:var(--tx3)}
.ck svg{stroke-width:2.6}
.sr.done .ck{background:var(--ac);color:var(--ink)}
.ex-h .ibtn{width:34px;height:34px}
.ex.skp{opacity:.75}
.ex.skp .n{text-decoration:line-through;color:var(--tx3)}
.ex-f{display:flex;align-items:center;gap:8px;margin-top:8px}
.ex-f select{width:auto;height:34px;padding:0 28px 0 10px;font-size:13px;border-radius:17px;background-color:var(--s2)}

#restbar{position:fixed;left:10px;right:10px;z-index:80;bottom:calc(78px + var(--sab));background:var(--s3);border:1px solid var(--acline);border-radius:20px;padding:10px 12px;display:none;align-items:center;gap:10px;overflow:hidden}
body.lv #restbar{bottom:calc(12px + var(--sab))}
#restbar.on{display:flex}
#restbar .pg{position:absolute;left:0;bottom:0;height:3px;background:var(--ac)}
#restbar .tm{font-size:26px;font-weight:700;min-width:74px}
#toast{position:fixed;left:50%;top:calc(var(--sat) + 12px);transform:translate(-50%,-24px);opacity:0;visibility:hidden;pointer-events:none;z-index:200;background:var(--s3);color:var(--tx);padding:12px 18px;border-radius:16px;font-size:15px;font-weight:500;transition:transform .25s,opacity .25s,visibility 0s .25s;max-width:90vw;text-align:center;border:1px solid var(--line)}
#toast.on{transform:translate(-50%,0);opacity:1;visibility:visible;pointer-events:auto;transition:transform .25s,opacity .2s}
#toast.gold{background:var(--s3);border-color:var(--gold);color:var(--gold)}
#hapt{position:fixed;left:-50px;top:0;width:1px;height:1px;opacity:0;overflow:hidden}
.plates{display:flex;align-items:center;justify-content:center;gap:3px;height:130px;margin:14px 0}
.plates .bar{width:40px;height:12px;background:#8d87a8;border-radius:3px}
.plates .pl{width:16px;border-radius:4px;display:flex;align-items:center;justify-content:center}
.plates .pl span{transform:rotate(-90deg);font-size:11px;font-weight:700;white-space:nowrap}
.mood{display:flex;gap:6px}
.mood button{flex:1;padding:8px 2px;border-radius:12px;background:var(--s2);font-size:12px;color:var(--tx2);display:flex;flex-direction:column;align-items:center;gap:4px}
.mood button.on{background:var(--acbg);color:var(--tx);outline:1px solid var(--acline)}
.rpe{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.rpe button{height:38px;border-radius:10px;background:var(--s2);font-weight:600;color:var(--tx2)}
.rpe button.on{background:var(--ac);color:var(--ink)}
.chart{width:100%;display:block}
/* aide : ?, appui long, guide */
.qm{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--tx3);color:var(--tx2);font-size:12px;font-weight:700;line-height:1;vertical-align:middle;margin-left:4px;flex:none;position:relative}
.qm::after{content:"";position:absolute;inset:-10px}
[data-tip]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#tip{position:fixed;z-index:300;left:12px;top:12px;background:var(--s3);color:var(--tx);border:1px solid var(--acline);border-radius:12px;padding:8px 12px;font-size:14px;line-height:1.35;opacity:0;pointer-events:none;transition:opacity .15s;box-shadow:0 8px 24px rgba(0,0,0,.45)}
#tip.on{opacity:1}
#guide{position:fixed;inset:0;z-index:250;background:var(--bg);display:none;flex-direction:column;padding:calc(var(--sat) + 12px) 24px calc(var(--sab) + 20px)}
#guide.on{display:flex}
.g-skip{align-self:flex-end;color:var(--tx2);font-size:15px;padding:8px 4px}
.g-body{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:440px;margin:0 auto;width:100%}
.g-ic{width:76px;height:76px;border-radius:24px;background:var(--acbg);color:var(--ac);display:flex;align-items:center;justify-content:center;margin-bottom:22px}
.g-ic svg{width:38px;height:38px}
.g-body h2{font-size:28px;margin:0 0 14px;letter-spacing:-.4px;line-height:1.15}
.g-body p{color:var(--tx2);font-size:16px;line-height:1.5;margin:0 0 12px}
.g-body p b{color:var(--tx)}
.g-dots{display:flex;gap:6px;justify-content:center;margin:18px 0}
.g-dots i{width:7px;height:7px;border-radius:4px;background:var(--s3);transition:width .2s}
.g-dots i.on{width:20px;background:var(--ac)}
.g-act{display:flex;flex-direction:column;gap:10px;max-width:440px;margin:0 auto;width:100%}
/* ================= MODE JEU ================= */
#top{position:sticky}
#game{position:fixed;inset:0;z-index:70;background:var(--bg);display:none;flex-direction:column}
#game.on{display:flex}
.g-h{padding:calc(var(--sat) + 10px) 16px 10px;background:var(--bgt);border-bottom:1px solid var(--line)}
.g-top{display:flex;align-items:center;gap:12px}
.g-av{width:52px;height:52px;border-radius:50%;overflow:hidden;background:var(--s3);flex:none;display:flex;align-items:center;justify-content:center;color:var(--ac);position:relative}
.g-av img{width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.fr-or{box-shadow:0 0 0 3px #f6c64a,0 0 14px rgba(246,198,74,.6)}
.fr-feu{box-shadow:0 0 0 3px #ff6a2b,0 0 16px rgba(255,90,30,.75)}
.fr-holo{box-shadow:0 0 0 3px transparent;background-clip:padding-box;outline:3px solid transparent;animation:holoRing 3s linear infinite}
@keyframes holoRing{0%{box-shadow:0 0 0 3px #ff4d9d,0 0 14px #ff4d9d}33%{box-shadow:0 0 0 3px #4dd2ff,0 0 14px #4dd2ff}66%{box-shadow:0 0 0 3px #b3ff4d,0 0 14px #b3ff4d}100%{box-shadow:0 0 0 3px #ff4d9d,0 0 14px #ff4d9d}}
.g-lv{flex:1;min-width:0}
.g-lv b{font-size:17px}
.g-bar{height:6px;border-radius:3px;background:var(--s3);overflow:hidden;margin-top:6px}
.g-bar i{display:block;height:100%;background:var(--ac);border-radius:3px}
.g-pts{text-align:right;font-weight:700;font-size:18px;white-space:nowrap}
.g-pts small{display:block;font-size:11px;color:var(--tx2);font-weight:500}
.g-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:12px}
.g-tabs .chip{justify-content:center;padding:8px 2px;font-size:12.5px;position:relative;min-width:0;white-space:nowrap}
.g-tabs .gtb{position:absolute;top:-6px;right:-2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.g-tabs::-webkit-scrollbar{display:none}
.g-b{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px calc(var(--sab) + 24px)}
/* boosters */
.pack{position:relative;width:170px;height:236px;margin:8px auto 14px;border-radius:16px;background:linear-gradient(160deg,var(--ac),var(--ac2) 55%,var(--s3));box-shadow:0 18px 40px rgba(0,0,0,.45),inset 0 0 0 2px rgba(255,255,255,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink);overflow:hidden}
.pack::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.0) 0 14px,rgba(255,255,255,.12) 14px 16px)}
.pack::after{content:"";position:absolute;left:0;right:0;top:22px;height:2px;background:rgba(0,0,0,.25);box-shadow:0 1px 0 rgba(255,255,255,.25)}
.pack .pk1{font-size:12px;font-weight:800;letter-spacing:2px;opacity:.75;position:relative}
.pack .pk2{font-size:30px;font-weight:900;line-height:1;margin:8px 0 4px;position:relative;text-align:center}
.pack .pk3{font-size:12px;font-weight:700;position:relative;opacity:.8}
.pack.leg{background:linear-gradient(160deg,#ffe08a,#f2b600 55%,#7a5200)}
.pack.big{width:220px;height:306px}
.pack.shake{animation:shake .5s ease-in-out infinite}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-2.5deg)}75%{transform:rotate(2.5deg)}}
.pack.tear{animation:tear .55s ease-in forwards}
@keyframes tear{to{transform:scale(1.25) translateY(-30px);opacity:0}}
.gstat{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.odds{display:grid;grid-template-columns:auto 1fr auto;gap:8px 10px;align-items:center;font-size:14px}
.odds .tr{height:6px;border-radius:3px;background:var(--s3);overflow:hidden}
.odds .tr i{display:block;height:100%;border-radius:3px}
/* cartes */
.fc{--rc:#9aa3ad;position:relative;aspect-ratio:63/88;border-radius:12px;perspective:900px;max-width:100%}
.fc .in{position:absolute;inset:0;transition:transform .6s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.fc.flip .in{transform:rotateY(180deg)}
.fc .fa,.fc .bk{position:absolute;inset:0;border-radius:inherit;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;padding:5px;background:var(--brd)}
.fc .bk{transform:rotateY(180deg)}
.fc .sk{position:relative;width:100%;height:100%;border-radius:8px;overflow:hidden;background:#101014;color:#fff}
.r-commun{--rc:#a7b0ba;--brd:linear-gradient(145deg,#d9dee3,#7d8791 45%,#c9d0d6 70%,#6c757e)}
.r-rare{--rc:#4fa8ff;--brd:linear-gradient(145deg,#9fd2ff,#1f6fd1 45%,#7cc0ff 70%,#16509c)}
.r-legendaire{--rc:#ffc83d;--brd:linear-gradient(145deg,#fff1b8,#d99a00 40%,#ffe27a 65%,#9c6a00)}
.r-mythique{--rc:#ff4d6d;--brd:conic-gradient(from var(--ang,0deg),#ff4d6d,#ffb84d,#fff35c,#4dffb8,#4dc3ff,#b84dff,#ff4d6d);animation:holo 4s linear infinite}
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes holo{to{--ang:360deg}}
.r-mythique .sk::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.22) 45%,rgba(140,220,255,.18) 52%,transparent 65%);background-size:250% 100%;animation:shine 3.2s linear infinite;pointer-events:none;mix-blend-mode:screen}
.r-legendaire .sk::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,240,180,.25) 50%,transparent 65%);background-size:250% 100%;animation:shine 4.5s linear infinite;pointer-events:none}
@keyframes shine{from{background-position:150% 0}to{background-position:-100% 0}}
/* collection : effets animés seulement sur les cartes visibles, cartes hors écran non dessinées */
.cgrid .fc{content-visibility:auto}
.fc.lzf:not(.vis),.fc.lzf:not(.vis) *,.fc.lzf:not(.vis) .sk::after{animation:none!important}
/* dos de carte sans effet brillant */
.fc .bkc{background:var(--rc)!important;box-shadow:none!important}
.fc .bkc .sk{background:#101014!important}
.fc .bkc .sk::after{display:none!important;animation:none!important}
/* carte ouverte : les cartes derrière ne bougent plus */
body.cs-open .fc:not(.big),body.cs-open .fc:not(.big) *,body.cs-open .fc:not(.big) .sk::after,body.cs-open .fc:not(.big) .ph::before{animation:none!important;transition:none!important}
body.cs-open .fc:not(.big){filter:none!important}
.fc.big .sk::after{mix-blend-mode:normal!important}
.fa .ph{position:absolute;inset:0 0 30% 0;background:#1b1b22 center 20%/cover no-repeat}
.fa .ph.none{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#2a2a35,#121217)}
.fa .ph.none svg{width:45%;opacity:.35}
.fa .ph::after{content:"";position:absolute;left:0;right:0;bottom:0;height:40%;background:linear-gradient(transparent,#101014)}
.fa .ov{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.6);border:1.5px solid var(--rc);border-radius:8px;padding:2px 6px;text-align:center;line-height:1}
.fa .ov b{display:block;font-size:18px;font-weight:900;color:#fff}
.fa .ov span{font-size:7.5px;font-weight:700;letter-spacing:.5px;color:var(--rc);text-transform:uppercase}
.fa .fl{position:absolute;top:6px;right:8px;font-size:18px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.fa .bt{position:absolute;left:0;right:0;bottom:0;height:34%;padding:4px 8px 7px;display:flex;flex-direction:column;justify-content:flex-end}
.fa .nm{font-weight:800;font-size:14px;line-height:1.1;text-wrap:balance}
.fa .ds{font-size:10px;color:#c9c9d4;margin-top:3px}
.fa .rt{font-size:9px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--rc);margin-top:3px}
.bk .sk{padding:10px 10px 8px;display:flex;flex-direction:column;gap:6px;background:radial-gradient(circle at 80% 0,rgba(255,255,255,.07),transparent 50%),#101014;overflow-y:auto}
.bk .t1{font-weight:800;font-size:14px;line-height:1.15}
.bk .t2{font-size:10.5px;color:#b9b9c6}
.bk .stt{display:grid;grid-template-columns:auto 1fr auto;gap:3px 6px;align-items:center;font-size:10px;color:#cfcfda}
.bk .stt .tr{height:4px;border-radius:2px;background:#2a2a33;overflow:hidden}
.bk .stt .tr i{display:block;height:100%;background:var(--rc)}
.bk .bio{font-size:10.5px;line-height:1.4;color:#e4e4ec}
.bk .rect{font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#8d8d9a;margin-bottom:3px}.bk .recg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}.bk .recg div{background:#1c1c23;border-radius:6px;padding:4px 2px;text-align:center}.bk .recg b{display:block;font-size:15px;font-weight:800;color:var(--rc);line-height:1.1}.bk .recg span{font-size:8px;color:#a9a9b6}.bk .pal{margin:0;padding-left:14px;font-size:10.5px;line-height:1.35;color:#f1f1f6}.bk .pal li{margin:1px 0}.bk .pal li::marker{color:var(--rc)}
.fc.big .bk .rect{font-size:11px}.fc.big .bk .recg b{font-size:21px}.fc.big .bk .recg span{font-size:10px}.fc.big .bk .pal{font-size:13px}
.bk .cr{font-size:8px;color:#8d8d9a;line-height:1.3;margin-top:auto}
/* tailles */
.fc.mini{border-radius:8px}
.fc.mini .fa,.fc.mini .bk{padding:3px}
.fc.mini .sk{border-radius:5px}
.fc.mini .nm{font-size:9.5px}
.fc.mini .ds,.fc.mini .rt{display:none}
.fc.mini .ov{top:3px;left:3px;padding:1px 4px;border-radius:5px}
.fc.mini .ov b{font-size:11px}.fc.mini .ov span{display:none}
.fc.mini .fl{font-size:11px;top:3px;right:4px}
.fc.mini .bt{padding:2px 4px 4px}
.fc.lock .sk{background:repeating-linear-gradient(135deg,#15151b 0 6px,#121217 6px 12px);display:flex;align-items:center;justify-content:center}
.fc.lock .sk b{font-size:22px;color:var(--rc);opacity:.55;font-weight:900}
.fc.lock .fa{filter:saturate(.5);opacity:.6}
.fc.big{width:min(78vw,330px);margin:0 auto}
.fc.big .nm{font-size:22px}.fc.big .ds{font-size:13px}.fc.big .rt{font-size:12px}
.fc.big .ov b{font-size:28px}.fc.big .ov span{font-size:10px}.fc.big .fl{font-size:28px}
.fc.big .bk .t1{font-size:21px}.fc.big .bk .t2{font-size:13px}.fc.big .bk .stt{font-size:12.5px;gap:5px 8px}.fc.big .bk .stt .tr{height:6px}.fc.big .bk .bio{font-size:13px}.fc.big .bk .cr{font-size:10px}
.fc.big .bk .sk{padding:16px 14px 12px;gap:10px}
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (min-width:520px){.cgrid{grid-template-columns:repeat(5,1fr)}}
.cgrid button{padding:0;border:0;background:none;display:block;width:100%}
/* ouverture */
#gopen{position:fixed;inset:0;z-index:90;background:radial-gradient(circle at 50% 35%,rgba(255,255,255,.08),transparent 60%),#07070b;display:none;flex-direction:column;align-items:center;justify-content:center;padding:calc(var(--sat) + 16px) 16px calc(var(--sab) + 18px);color:#fff}
#gopen.on{display:flex}
#gopen .glow{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .4s}
#gopen .lbl{height:28px;margin-top:16px;font-weight:800;letter-spacing:1px;text-align:center}
#gopen .lbl.new{color:#7dffb3}
#gopen .lbl.dup{color:#c9c9d4;font-weight:600}
#gopen .hint{color:#9a9aa8;font-size:13px;margin-top:8px;text-align:center}
#gopen .cnt{position:absolute;top:calc(var(--sat) + 14px);left:0;right:0;text-align:center;font-size:13px;color:#9a9aa8}
#gopen .skip{position:absolute;top:calc(var(--sat) + 8px);right:14px;color:#c9c9d4;font-size:14px;padding:8px}
#gopen .sum{width:100%;max-width:460px;overflow-y:auto}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.rbg-rare{opacity:1!important;background:radial-gradient(circle at 50% 40%,rgba(79,168,255,.35),transparent 60%)}
.rbg-legendaire{opacity:1!important;background:radial-gradient(circle at 50% 40%,rgba(255,200,61,.45),transparent 62%)}
.rbg-mythique{opacity:1!important;background:radial-gradient(circle at 50% 40%,rgba(255,77,109,.45),rgba(120,77,255,.25) 45%,transparent 68%);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.6}}
/* missions, badges, boutique */
.mis{display:flex;gap:12px;align-items:center}
.mis .ico{width:40px;height:40px;border-radius:12px;background:var(--acbg);color:var(--ac);display:flex;align-items:center;justify-content:center;flex:none}
.mis.ok .ico{background:var(--ac);color:var(--ink)}
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bdg{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;font-size:12px;color:var(--tx2)}
.bdg .bi{width:44px;height:44px;border-radius:50%;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;background:var(--s3);color:var(--tx3)}
.bdg.got{color:var(--tx)}
.bdg.got .bi{background:var(--goldbg);color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.bdg b{display:block;font-size:13px;margin-bottom:2px}
.shop{display:grid;gap:8px}
.shop .it{display:flex;align-items:center;gap:12px;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px}
.shop .sw2{width:44px;height:44px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center}
.fxp{position:fixed;z-index:95;width:8px;height:8px;border-radius:50%;pointer-events:none;animation:fxp .7s ease-out forwards}
@keyframes fxp{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.rew{display:flex;align-items:center;gap:12px;background:var(--acbg);border:1px solid var(--acline);border-radius:14px;padding:12px 14px;margin-top:12px}
.lockt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45);border-radius:inherit;font-size:11px;color:#fff;font-weight:700}

/* bouton d'entrée : emblème */
#gbtn{position:absolute;right:16px;bottom:10px;width:50px;height:56px;padding:0;border:0;background:none;display:block}
#gbtn .emb{position:absolute;inset:0;clip-path:polygon(50% 0,100% 16%,100% 58%,50% 100%,0 58%,0 16%);background:linear-gradient(160deg,var(--ac2),var(--ac) 55%,var(--s3));display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink);overflow:hidden}
#gbtn .emb::before{content:"";position:absolute;inset:3px;clip-path:inherit;background:linear-gradient(160deg,rgba(255,255,255,.28),rgba(255,255,255,0) 50%)}
#gbtn .emb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%}
#gbtn .emb b{position:relative;font-size:19px;font-weight:900;line-height:1;margin-top:-4px}
#gbtn .emb small{position:relative;font-size:8px;font-weight:800;letter-spacing:1px;opacity:.75}
#gbtn .lvc{position:absolute;left:50%;bottom:-4px;transform:translateX(-50%);background:var(--s1);color:var(--tx);border:1px solid var(--line);border-radius:8px;font-size:10px;font-weight:800;padding:1px 6px;white-space:nowrap}
#gbtn .bd{position:absolute;top:-4px;right:-6px;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--red);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--bg)}
#gbtn.has .emb{animation:embPulse 2.4s ease-in-out infinite}
@keyframes embPulse{50%{filter:brightness(1.25) drop-shadow(0 0 6px var(--ac))}}
#gbtn:active{transform:scale(.94)}
/* entrée dans le mode jeu */
#game{clip-path:circle(0 at var(--gx,85%) var(--gy,8%));transition:clip-path .5s cubic-bezier(.65,0,.25,1)}
#game.in{clip-path:circle(150% at var(--gx,85%) var(--gy,8%))}
#game.in .g-b>*{animation:gUp .45s ease-out both}
#game.in .g-b>*:nth-child(2){animation-delay:.05s}#game.in .g-b>*:nth-child(3){animation-delay:.1s}#game.in .g-b>*:nth-child(n+4){animation-delay:.15s}
@keyframes gUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* ouverture */
#gopen{transition:background .5s}
#gopen.dark{background:#000}
#gopen .stage{position:relative;z-index:2;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
#gfx{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
.flashw{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0}
.flashw.go{animation:flashA .55s ease-out}
@keyframes flashA{0%{opacity:.95}100%{opacity:0}}
.rays{position:absolute;left:50%;top:45%;width:180vmax;height:180vmax;transform:translate(-50%,-50%) scale(.6);opacity:0;z-index:1;pointer-events:none;transition:opacity .6s,transform .8s cubic-bezier(.2,.8,.2,1);border-radius:50%;-webkit-mask:radial-gradient(circle,#000 0,transparent 55%);mask:radial-gradient(circle,#000 0,transparent 55%)}
.rays.on{opacity:1;transform:translate(-50%,-50%) scale(1);animation:spin 14s linear infinite}
.rays.r-rare{background:repeating-conic-gradient(rgba(79,168,255,.35) 0 8deg,transparent 8deg 20deg)}
.rays.r-legendaire{background:repeating-conic-gradient(rgba(255,200,61,.5) 0 7deg,transparent 7deg 16deg)}
.rays.r-mythique{background:repeating-conic-gradient(rgba(255,77,109,.55) 0 6deg,rgba(255,243,92,.5) 6deg 12deg,rgba(77,195,255,.5) 12deg 18deg,transparent 18deg 26deg);animation-duration:7s}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
/* booster 3D */
.pk3d{position:relative;width:220px;height:310px;animation:floaty 3s ease-in-out infinite;cursor:pointer;filter:drop-shadow(0 22px 40px rgba(0,0,0,.6))}
.pk3d .pbody,.pk3d .ptop{position:absolute;left:0;right:0;background:linear-gradient(160deg,var(--ac2),var(--ac) 50%,#2a1f55);overflow:hidden}
.pk3d.leg .pbody,.pk3d.leg .ptop{background:linear-gradient(160deg,#ffe08a,#f2b600 55%,#6b4800)}
.pk3d .ptop{top:0;height:34px;border-radius:16px 16px 4px 4px;transform-origin:20% 100%;background-size:100% 310px}
.pk3d .pbody{top:30px;bottom:0;border-radius:4px 4px 16px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink);background-position:0 -30px;background-size:100% 310px}
.pk3d .pbody::before,.pk3d .ptop::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,0) 0 14px,rgba(255,255,255,.13) 14px 16px)}
.pk3d .ptop::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:repeating-linear-gradient(90deg,rgba(0,0,0,.35) 0 6px,transparent 6px 10px)}
.pk3d .pk2{position:relative;font-size:34px;font-weight:900;line-height:.95;text-align:center;letter-spacing:-.5px}
.pk3d .pk3{position:relative;font-size:13px;font-weight:800;margin-top:10px;opacity:.85}
.pk3d .pshine{position:absolute;inset:0;border-radius:16px;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.45) 48%,transparent 60%);background-size:300% 100%;animation:shine 2.8s ease-in-out infinite;pointer-events:none;mix-blend-mode:overlay}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-12px) rotate(1.5deg)}}
.pk3d.charge{animation:chargeP .65s ease-in forwards}
@keyframes chargeP{0%{transform:scale(1)}20%{transform:scale(1.03) rotate(-3deg)}40%{transform:scale(1.05) rotate(3deg)}60%{transform:scale(1.07) rotate(-4deg)}80%{transform:scale(1.09) rotate(4deg)}100%{transform:scale(1.1) rotate(0);filter:drop-shadow(0 0 30px #fff) brightness(1.3)}}
.pk3d.burst{animation:none;transform:scale(1.1)}
.pk3d.burst .ptop{animation:topOff .6s cubic-bezier(.3,.6,.4,1) forwards}
.pk3d.burst .pbody{animation:bodyOff .55s .1s ease-in forwards}
.pk3d.burst .pshine{opacity:0}
@keyframes topOff{to{transform:translate(90px,-260px) rotate(55deg);opacity:0}}
@keyframes bodyOff{to{transform:translateY(160px) scale(.9);opacity:0}}
/* cartes à révéler */
.cwrap{perspective:1200px}
.cwrap.enter{animation:cIn .55s cubic-bezier(.2,1.25,.4,1) both}
.cwrap.leave{animation:cOut .28s ease-in forwards}
@keyframes cIn{from{transform:translateY(70vh) rotate(8deg) scale(.8)}to{transform:none}}
@keyframes cOut{to{transform:translateX(-120vw) rotate(-18deg);opacity:.2}}
#gopen .fc.big .in{transition:transform .75s cubic-bezier(.25,.9,.3,1.15)}
.cbk{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#2c2a44,#0c0b14)!important}
.cbk::before{content:"";position:absolute;inset:10px;border:2px solid rgba(255,255,255,.12);border-radius:8px}
.cbl{font-size:26px;font-weight:900;line-height:.95;text-align:center;color:rgba(255,255,255,.85);letter-spacing:-.3px}
.tease-rare .bk{box-shadow:0 0 22px 2px rgba(79,168,255,.55)}
.tease-legendaire .bk{box-shadow:0 0 30px 6px rgba(255,200,61,.6)}
.tease-mythique .bk{box-shadow:0 0 38px 10px rgba(255,77,109,.55),0 0 70px 20px rgba(120,77,255,.35)}
.fc.charge{animation:cCharge .38s ease-in-out}
.fc.charge1{animation:cShake .9s ease-in-out}
.fc.charge2{animation:cShake2 1.5s ease-in-out}
@keyframes cCharge{50%{transform:scale(1.04)}}
@keyframes cShake{0%,100%{transform:none}20%{transform:translateX(-4px) rotate(-1deg)}40%{transform:translateX(5px) rotate(1deg)}60%{transform:translateX(-6px) rotate(-1.5deg) scale(1.02)}80%{transform:translateX(6px) rotate(1.5deg) scale(1.04)}}
@keyframes cShake2{0%{transform:none}15%{transform:translateX(-3px)}30%{transform:translateX(4px) scale(1.02)}45%{transform:translateX(-6px) rotate(-2deg) scale(1.04)}60%{transform:translateX(7px) rotate(2deg) scale(1.06)}75%{transform:translateX(-9px) rotate(-3deg) scale(1.08)}90%{transform:translateX(9px) rotate(3deg) scale(1.1)}100%{transform:scale(1.1)}}
.fc.reveal{animation:cPop .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes cPop{0%{transform:scale(1.08)}60%{transform:scale(.97)}100%{transform:none}}
#gopen .lbl{opacity:0}

#gopen.quake{animation:quake .5s cubic-bezier(.36,.07,.19,.97)}
@keyframes quake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(5px,-3px)}30%,50%,70%{transform:translate(-9px,4px)}40%,60%{transform:translate(9px,-4px)}}
.cwrap.spre{position:relative}
.cwrap.spre .fc{opacity:0}
.cwrap.spre .sq{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.cwrap.spre.show .sq{display:none}
.cwrap.spre.show .fc{opacity:1;animation:sPop .7s cubic-bezier(.2,1.3,.4,1) both}
@keyframes sPop{from{transform:scale(.55) rotate(-4deg);filter:brightness(3)}to{transform:none;filter:none}}
.cwrap.spre .fc .in{transition:transform .6s cubic-bezier(.3,.7,.3,1)}
.sq .seye{font-size:150px}

#gglass .gbk{position:absolute;inset:0;background:#050508}
#gglass.fall .gbk{opacity:0;transition:opacity .15s}
#gglass:not(.hit) .shd{background:#050508}

/* v2 : vitre sur canvas, gant de face, ouverture secrète */
#gglass canvas{position:absolute;inset:0;width:100%;height:100%}
#gglass .glove{position:absolute;left:50%;top:46%;width:150px;height:186px;margin:-93px 0 0 -75px;opacity:0;filter:drop-shadow(0 30px 40px rgba(0,0,0,.8));will-change:transform}
#gglass.punch .glove{animation:gPunchF .46s cubic-bezier(.7,0,.95,.55) forwards}
#gglass.hit .glove{animation:gHitF .45s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes gPunchF{0%{opacity:0;transform:translateY(-75vh) scale(4.2) rotate(8deg);filter:blur(10px)}30%{opacity:1}100%{opacity:1;transform:translateY(0) scale(1) rotate(0);filter:blur(0) drop-shadow(0 30px 40px rgba(0,0,0,.8))}}
@keyframes gHitF{0%{opacity:1;transform:scale(1.04,.86)}30%{opacity:1;transform:scale(.97,1.03)}100%{opacity:0;transform:translateY(-30vh) scale(3.2);filter:blur(8px)}}
#gopen.blackout{background:#000;transition:background .25s}
.pk3d.secopen{animation:none}
.pk3d.secopen .ptop{animation:topOff2 .7s cubic-bezier(.25,.6,.35,1) forwards}
.pk3d.secopen .tline{opacity:0!important}
.pk3d.secopen .pbody{animation:secGlow 1.5s ease-in forwards}
@keyframes secGlow{0%{filter:none}30%{filter:brightness(.35) saturate(.4)}60%{filter:brightness(.35) saturate(.4)}100%{filter:brightness(.6) hue-rotate(-40deg) saturate(2) drop-shadow(0 0 30px #6b5bff)}}
.pk3d.secopen::after{content:"";position:absolute;left:10%;right:10%;top:20px;height:40px;border-radius:50%;background:radial-gradient(closest-side,rgba(185,166,255,.95),rgba(0,224,198,.5),transparent);opacity:0;animation:leak 1.5s .3s ease-in forwards;mix-blend-mode:screen}
@keyframes leak{0%{opacity:0;transform:scaleY(.4)}40%{opacity:.4}60%{opacity:.2}100%{opacity:1;transform:scale(1.4,2.2)}}
#gopen.blackout .stage{animation:flick .9s steps(1) 1}
@keyframes flick{0%{opacity:1}10%{opacity:.15}18%{opacity:1}30%{opacity:.3}36%{opacity:1}60%{opacity:.6}64%{opacity:1}}
.pk3d.beat{animation:beat .8s ease-in-out}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.07)}30%{transform:scale(.99)}50%{transform:scale(1.12)}70%{transform:scale(1)}}
.pk3d.implode{animation:implode .35s cubic-bezier(.6,0,1,.6) forwards}
@keyframes implode{to{transform:scale(0) rotate(-12deg);filter:brightness(4) drop-shadow(0 0 40px #b9a6ff);opacity:.4}}
.shock{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:3px solid rgba(185,166,255,.95);box-shadow:0 0 30px rgba(0,224,198,.8),inset 0 0 20px rgba(255,61,240,.6);z-index:5;pointer-events:none;animation:shock 1.1s cubic-bezier(.1,.7,.3,1) forwards}
.shock.s2{border-color:rgba(0,224,198,.8);animation-delay:.15s;opacity:0;animation-fill-mode:forwards}
@keyframes shock{0%{transform:scale(0);opacity:1}100%{transform:scale(45);opacity:0;border-width:1px}}
#gglass .glove{width:200px;height:248px;margin:-124px 0 0 -100px}

/* arène mythique */
#garena{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity .5s;overflow:hidden}
#garena.on{opacity:1}#garena.out{opacity:0}
#garena .fog{position:absolute;left:-30%;right:-30%;bottom:-10%;height:45%;background:radial-gradient(ellipse at 30% 70%,rgba(255,77,109,.18),transparent 60%),radial-gradient(ellipse at 70% 80%,rgba(180,180,220,.16),transparent 60%);filter:blur(18px);animation:fogm 7s ease-in-out infinite alternate}
#garena .fog.f2{bottom:-18%;opacity:.8;animation-duration:9s;animation-direction:alternate-reverse}
@keyframes fogm{from{transform:translateX(-6%)}to{transform:translateX(6%)}}
#garena .beam{position:absolute;top:-10%;width:46vmin;height:125%;background:linear-gradient(180deg,rgba(255,250,235,.55),rgba(255,240,210,.12) 70%,transparent);clip-path:polygon(45% 0,55% 0,100% 100%,0 100%);filter:blur(6px);mix-blend-mode:screen;opacity:0;transform-origin:50% 0;transition:opacity .4s}
#garena .b1{left:-8%;transform:rotate(-28deg)}#garena .b2{right:-8%;transform:rotate(28deg)}
#garena.search .beam{opacity:1}
#garena.search .b1{animation:sweep1 1.4s ease-in-out forwards}#garena.search .b2{animation:sweep2 1.4s ease-in-out forwards}
@keyframes sweep1{0%{transform:rotate(-28deg)}35%{transform:rotate(8deg)}70%{transform:rotate(-34deg)}100%{transform:rotate(-12deg)}}
@keyframes sweep2{0%{transform:rotate(28deg)}35%{transform:rotate(-6deg)}70%{transform:rotate(36deg)}100%{transform:rotate(12deg)}}
#garena.lock .b1{animation:none;transform:rotate(-17deg);transition:transform .5s cubic-bezier(.3,.7,.3,1)}#garena.lock .b2{animation:none;transform:rotate(17deg);transition:transform .5s cubic-bezier(.3,.7,.3,1)}
#garena.boom .beam{background:linear-gradient(180deg,rgba(255,220,230,.75),rgba(255,77,109,.2) 70%,transparent)}
#garena .crowd i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:0;box-shadow:0 0 8px 3px rgba(255,255,255,.8);animation:camf 2s infinite}
#garena.search .crowd i,#garena.lock .crowd i{animation-name:camf}
#garena.boom .crowd i{animation-duration:.9s!important}
@keyframes camf{0%,86%,100%{opacity:0;transform:scale(.4)}90%{opacity:1;transform:scale(1.6)}}
.mann{position:absolute;top:calc(var(--sat) + 18px);left:0;right:0;text-align:center;font-family:var(--fd);font-style:italic;font-weight:800;color:#fff;z-index:3;pointer-events:none}
.mann span{display:inline-block;font-size:22px;letter-spacing:3px;text-transform:uppercase;opacity:.9;animation:annIn .6s ease-out both;text-shadow:0 0 14px rgba(255,77,109,.7)}
.mann b{display:inline-block;font-size:46px;line-height:1;letter-spacing:2px;background:linear-gradient(90deg,#ff4d6d,#ffb84d,#fff35c,#4dffb8,#4dc3ff,#b84dff);-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 .12em;filter:drop-shadow(0 4px 14px rgba(255,77,109,.6))}
.mann.stamp b{animation:stampIn .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes annIn{from{opacity:0;transform:translateY(-8px);filter:blur(4px)}to{opacity:.9;transform:none;filter:none}}
@keyframes stampIn{0%{opacity:0;transform:scale(2.8) rotate(-8deg)}60%{opacity:1;transform:scale(.92) rotate(-3deg)}100%{transform:scale(1) rotate(-3deg)}}
.shock.myth{border-color:rgba(255,200,120,.95);box-shadow:0 0 30px rgba(255,77,109,.9),inset 0 0 20px rgba(255,243,92,.6)}

/* arène allégée (moins de calculs pour le téléphone) */
#garena .fog{filter:none;animation:none;opacity:.8}
#garena .beam{filter:none;mix-blend-mode:normal;background:linear-gradient(180deg,rgba(255,250,235,.32),rgba(255,240,210,.08) 70%,transparent)}
#garena.boom .beam{background:linear-gradient(180deg,rgba(255,200,215,.4),rgba(255,77,109,.12) 70%,transparent)}
#garena .crowd i{box-shadow:0 0 6px 2px rgba(255,255,255,.7)}
#garena .b0{left:50%;margin-left:-23vmin;top:-6%;height:85%;transform:none;opacity:0;transition:opacity .5s}
#garena.spot .b0{opacity:1}
#garena.spot .crowd i{animation-name:camf}
.pk3d.mopen{animation:none}
.pk3d.mopen .ptop{animation:topOff2 .7s cubic-bezier(.25,.6,.35,1) forwards}
.pk3d.mopen .tline{opacity:0!important}
.pk3d.mopen .pbody{transition:filter .5s;filter:drop-shadow(0 0 18px rgba(255,77,109,.55))}
.pk3d.rumble{animation:rumble .7s ease-in forwards}
@keyframes rumble{0%{transform:none}20%{transform:translate(-2px,0) rotate(-1deg)}40%{transform:translate(3px,-1px) rotate(1deg) scale(1.02)}60%{transform:translate(-4px,1px) rotate(-1.5deg) scale(1.04)}80%{transform:translate(4px,-1px) rotate(1.5deg) scale(1.06)}100%{transform:scale(1.08)}}
.pk3d.mopen.burst .ptop{animation:none;opacity:0}

/* commune / rare / légendaire : effets propres */
.ropes{position:absolute;left:-5%;right:-5%;top:50%;height:120px;margin-top:-60px;z-index:1;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;opacity:0}
.ropes i{display:block;height:6px;border-radius:3px;background:linear-gradient(180deg,#9fd2ff,#2f7fe0 60%,#16509c);box-shadow:0 0 12px rgba(79,168,255,.6)}
.ropes.on{animation:ropesIn 1.6s ease-out forwards}
.ropes.on i{animation:twang .7s ease-out}
.ropes.on i:nth-child(2){animation-delay:.05s}.ropes.on i:nth-child(3){animation-delay:.1s}
.ropes.soft{height:150px;margin-top:-75px}
@keyframes ropesIn{0%{opacity:0;transform:scaleX(.6)}15%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0}}
@keyframes twang{0%{transform:scaleY(1)}15%{transform:translateY(-7px) scaleY(1.6)}30%{transform:translateY(5px)}45%{transform:translateY(-3px)}60%{transform:translateY(2px)}100%{transform:none}}
.ding{position:absolute;top:calc(var(--sat) + 60px);left:0;right:0;text-align:center;z-index:5;pointer-events:none}
.ding b{display:inline-block;font-family:var(--fd);font-style:italic;font-weight:800;font-size:54px;color:#e8f4ff;letter-spacing:3px;text-shadow:0 0 18px #4fa8ff;animation:dingIn 1.2s cubic-bezier(.2,1.4,.4,1) forwards}
.ding.sm{top:calc(var(--sat) + 42px)}.ding.sm b{font-size:30px}
@keyframes dingIn{0%{opacity:0;transform:scale(.4) rotate(-6deg)}20%{opacity:1;transform:scale(1.08) rotate(3deg)}30%{transform:rotate(-3deg)}40%{transform:rotate(2deg)}50%{transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
.shock.ringw{border-color:rgba(159,210,255,.95);box-shadow:0 0 20px rgba(79,168,255,.8)}
.shock.ringw.sm{animation-duration:.8s}
.shock.goldw{border-color:rgba(255,225,140,.95);box-shadow:0 0 26px rgba(255,200,61,.8),inset 0 0 16px rgba(255,240,180,.6)}
.glight{position:absolute;left:50%;bottom:-10%;width:90vmin;height:90%;margin-left:-45vmin;z-index:1;pointer-events:none;opacity:0;background:radial-gradient(ellipse 50% 60% at 50% 100%,rgba(255,215,110,.55),rgba(255,190,60,.15) 55%,transparent 75%)}
.glight.on{animation:glIn 1.8s ease-out forwards}.glight.low{animation-duration:1.9s}
@keyframes glIn{0%{opacity:0;transform:scaleY(.4);transform-origin:50% 100%}35%{opacity:1;transform:none}80%{opacity:.8}100%{opacity:0}}
.pk3d.gold .pbody{transition:filter .5s;filter:brightness(1.25) drop-shadow(0 0 22px rgba(255,200,61,.8))}
.pk3d.gold{animation:rumble .55s ease-in forwards}
.mann.gold{z-index:5}
.mann.gold b{font-size:38px;background:linear-gradient(180deg,#fff6cf,#ffd45c 45%,#c98a00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 10px rgba(255,200,61,.6))}

#gopen .snd{position:absolute;top:calc(var(--sat) + 6px);left:10px;z-index:9;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.08);color:#c9c9d4;display:flex;align-items:center;justify-content:center}
#gopen .snd .x{display:none}#gopen .snd.off .x{display:inline}#gopen .snd.off .w{display:none}#gopen .snd.off{opacity:.6}

const JOURS=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];

const fmtDayLong=k=>{const d=fromDk(k);return JOURS[d.getDay()]+' '+d.getDate()+' '+MOIS[d.getMonth()]};
const LB=0.45359237;
const toU=(kg,u)=>kg==null?null:(u==='lb'?Math.round(kg/LB*10)/10:kg);

const addDays=(d,n)=>{d=new Date(d);d.setDate(d.getDate()+n);return d};

function lastPerf(exId,tplId,before,excl){
  const list=S.sessions.filter(s=>s.done&&s.id!==excl&&s.start<before).sort((a,b)=>b.start-a.start);
  const has=s=>s.items.some(i=>i.exId===exId&&i.sets.some(x=>x.done));
  const s=(tplId&&list.find(s=>s.templateId===tplId&&has(s)))||list.find(has);
  if(!s)return null;
  const sets=[];s.items.filter(i=>i.exId===exId).forEach(i=>i.sets.filter(x=>x.done).forEach(x=>sets.push({w:x.w,r:x.r,t:x.t,d:x.d})));
  return {sets,date:s.date};
}
function lastStatus(exId,tplId,before,excl){
  const list=S.sessions.filter(s=>s.done&&s.id!==excl&&s.start<before).sort((a,b)=>b.start-a.start);
  const has=s=>s.items.some(i=>i.exId===exId&&(i.skipped||i.sets.some(x=>x.done)));
  const s=(tplId&&list.find(s=>s.templateId===tplId&&has(s)))||list.find(has);

}

const METRICS={
  charge:[['max','Charge max','kg'],['e1rm','1RM estimé','kg'],['vol','Volume','kg']],
  reps:[['max','Reps max',''],['vol','Total reps','']],
  temps:[['max','Durée max','s'],['vol','Durée totale','s']],
  distance:[['max','Distance','km'],['vol','Durée','min']],
};
function metric(type,sets,m){
  const k=type==='charge'?'w':type==='reps'?'r':type==='temps'?'t':'d';
  if(m==='max')return Math.max(...sets.map(x=>x[k]||0));
  if(m==='e1rm')return Math.max(...sets.map(x=>e1rm(x.w,x.r)));
  if(type==='charge')return sets.reduce((a,x)=>a+(x.w||0)*(x.r||0),0);
  if(type==='distance')return sets.reduce((a,x)=>a+(x.t||0),0);
  return sets.reduce((a,x)=>a+(x[k]||0),0);
}
function fmtMetric(type,m,v){
  if(type==='temps')return fmtSec(v);
  if(m==='vol'&&type==='charge')return fmtK(v)+' kg';
  const u=(METRICS[type].find(x=>x[0]===m)||[])[2];
  return fmtN(Math.round(v*10)/10)+(u?' '+u:'');
}
function bestOf(exId){
  const h=exHistory(exId);if(!h.length)return null;
  const type=(exById(exId)||{}).type||'charge';let best=null,bd=null,be=0,bed=null;
  h.forEach(({s,sets})=>sets.forEach(x=>{
    const v=type==='charge'?(x.w||0):type==='reps'?(x.r||0):type==='temps'?(x.t||0):(x.d||0);
    if(best==null||v>best.v){best={v,x};bd=s.date}
    if(type==='charge'){const e=e1rm(x.w,x.r);if(e>be){be=e;bed=s.date}}
  }));
  return {type,best,bd,be,bed,count:h.length};
}

const sheets=[];
function openSheet(html='',onClose){

  document.body.appendChild(w);const body=w.querySelector('.sheet-body');body.innerHTML=html;
  requestAnimationFrame(()=>requestAnimationFrame(()=>w.classList.add('in')));
  const sh=w.querySelector('.sheet'),me={w,onClose};
  const closeMe=()=>{if(sheets[sheets.length-1]===me)closeSheet()};
  w.querySelector('.sheet-bg').addEventListener('click',closeMe);
  w.querySelector('.sheet-x').addEventListener('click',closeMe);
  /* glisser vers le bas pour fermer */
  let y0=null,x0=0,dy=0,t0=0,drag=false,fromTop=false;
  sh.addEventListener('touchstart',e=>{const t=e.target;if(e.touches.length>1||t.closest('input,textarea,select,.sheet-x')){y0=null;return}
    fromTop=!!t.closest('.sheet-top');if(!fromTop&&body.scrollTop>0){y0=null;return}
    y0=e.touches[0].clientY;x0=e.touches[0].clientX;dy=0;t0=Date.now();drag=false},{passive:true});
  sh.addEventListener('touchmove',e=>{if(y0==null)return;const d=e.touches[0].clientY-y0,dx=e.touches[0].clientX-x0;
    if(!drag){if(Math.abs(dx)>Math.abs(d)+4||d<-4){y0=null;return}if(d<8)return;if(!fromTop&&body.scrollTop>0){y0=null;return}drag=true;sh.classList.add('drag')}
    dy=Math.max(0,d);sh.style.transform='translateY('+dy+'px)';if(e.cancelable)e.preventDefault()},{passive:false});
  const end=()=>{if(y0==null&&!drag)return;y0=null;if(!drag)return;drag=false;sh.classList.remove('drag');
    const v=dy/Math.max(1,Date.now()-t0);sh.style.transform='';if(dy>110||(dy>40&&v>.5))closeMe()};
  sh.addEventListener('touchend',end);sh.addEventListener('touchcancel',end);
  sheets.push(me);return body;
}
function closeSheet(){const s=sheets.pop();if(!s)return;s.w.classList.remove('in');setTimeout(()=>s.w.remove(),260);s.onClose&&s.onClose()}

function weekStats(ws){
  const we=addDays(ws,7);const done=S.sessions.filter(s=>s.done&&fromDk(s.date)>=ws&&fromDk(s.date)<we);
  let planned=0;for(let i=0;i<7;i++)if(planFor(dk(addDays(ws,i))))planned++;return {done,planned};
}
function streak(){
  let n=0;const now=weekStart(new Date());
  const cur=weekStats(now);const need=w=>Math.max(1,w.planned);
  if(cur.done.length>=need(cur))n++;
  for(let i=1;i<520;i++){const w=weekStats(addDays(now,-7*i));if(w.done.length>=need(w))n++;else break}
  return n;
}

  if(examplePlanOn())h+=`<div class="banner" style="align-items:flex-start">${ic('cal')}<div class="grow"><b>Planning d’exemple</b><div class="small muted">Push, Pull et Jambes sont là pour t’aider à démarrer. Garde-les et modifie-les, ou repars de zéro.</div><div class="row" style="margin-top:10px;gap:8px"><button class="btn sm" data-a="exClear">Vider le planning</button><button class="btn sm sec" data-a="exKeep">Garder</button></div></div></div>`;
  const tpl=planFor(tk);const doneToday=sessOn(tk);
  if(doneToday.length){
    const s=doneToday[doneToday.length-1];
    h+=`<div class="today"><div class="bar" style="background:${s.color||'var(--ac)'}"></div><div class="lab">Aujourd’hui · séance faite</div><div class="ttl">${esc(s.name)}</div><div class="small muted">${sessSets(s)} séries · ${fmtK(sessVolume(s))} kg · ${fmtDur(s.end-s.start)}</div><div class="row" style="margin-top:14px"><button class="btn sec sm" data-a="sdetail" data-id="${s.id}">Voir le détail</button><button class="btn ghost sm" data-a="pickStart">Autre séance</button></div></div>`;
  }else if(tpl){
    h+=`<div class="today"><div class="bar" style="background:${tpl.color}"></div><div class="lab">Aujourd’hui</div><div class="ttl">${esc(tpl.name)}</div><div class="small muted">${tpl.items.length} exercices · environ ${tplMinutes(tpl)} min</div><div class="small dim" style="margin-top:6px;line-height:1.5">${tpl.items.map(i=>esc(exName(i))).join(' · ')}</div><button class="btn full" style="margin-top:14px" data-a="start" data-id="${tpl.id}">${ic('play','s')}Commencer</button></div>`;
  }else{
    h+=`<div class="today"><div class="lab">Aujourd’hui</div><div class="ttl">Jour de repos</div><div class="small muted">Rien de prévu. Tu peux quand même t’entraîner.</div><div class="row" style="margin-top:14px"><button class="btn sm" data-a="pickStart">${ic('play','s')}Démarrer une séance</button></div></div>`;
  }
  const ws=addDays(weekStart(now),7*homeWeekOff),we=addDays(ws,6);
  const wl=homeWeekOff===0?'Ma semaine':homeWeekOff===1?'Semaine prochaine':homeWeekOff===-1?'Semaine dernière':'Du '+ws.getDate()+' '+MC[ws.getMonth()]+' au '+we.getDate()+' '+MC[we.getMonth()];
  h+=`<div class="row between" style="margin:20px 0 8px"><button class="ibtn" style="width:32px;height:32px" data-a="hwk" data-n="-1" aria-label="Semaine précédente">${ic('left','s')}</button><div class="h2" style="margin:0">${wl}</div><button class="ibtn" style="width:32px;height:32px" data-a="hwk" data-n="1" aria-label="Semaine suivante">${ic('right','s')}</button></div><div class="week">`;
  WEEK.forEach((d,i)=>{
    const day=addDays(ws,i),k=dk(day),t=planFor(k),dn=sessOn(k),ov=S.planDates[k]!==undefined;
    let st='';
    if(dn.length)st=`<div class="st" style="background:${dn[0].color||'var(--ac)'};color:var(--ink)">${ic('check')}</div>`;
    else if(t&&k<tk&&k>=since())st=`<div class="st" style="border:1.5px solid var(--red);color:var(--red)">${ic('x')}</div>`;
    else if(t)st=`<div class="st" style="border:1.5px solid ${t.color}"></div>`;
    h+=`<button class="wd ${k===tk?'today':''} ${ov?'ov':''}" data-a="calDay" data-k="${k}"><span class="d1">${JC[d]}</span><span class="d2">${day.getDate()}</span><span class="pl" style="${t?'color:'+t.color+';background:'+t.color+'22':'color:var(--tx3)'}">${t?esc(shortName(t.name)):'Repos'}</span>${st}</button>`;
  });
  h+=`</div><div class="tiny dim" style="margin:8px 4px 0">Touche un jour pour voir ou choisir sa séance.</div>`;
  const w=weekStats(weekStart(now)),sk=streak();
  h+=`<div class="tiles" style="margin-top:16px"><div class="tile"><div class="small muted">Cette semaine</div><div class="v num">${w.done.length}<small> / ${Math.max(w.planned,w.done.length)} séances</small></div></div><div class="tile"><div class="small muted">Série en cours${qm('streak')}</div><div class="v num">${sk}<small> semaine${sk>1?'s':''}</small></div></div></div>`;
  const last=doneSess().slice(-3).reverse();
  if(last.length){h+=`<div class="h2">Dernières séances</div><div class="card list">`+last.map(s=>sessRow(s)).join('')+`</div>`}
  return {sub:fmtDayLong(tk),title:'Carnet Muscu',html:h};
}
function sessRow(s){return `<button class="li" style="width:100%;text-align:left" data-a="sdetail" data-id="${s.id}"><span class="dot" style="background:${s.color||'var(--ac)'}"></span><div class="grow"><div class="ell" style="font-weight:600">${esc(s.name)}</div><div class="small muted">${fmtDay(s.date)} · ${sessSets(s)} séries · ${fmtK(sessVolume(s))} kg</div></div>${(s.records||[]).length?`<span class="badge gold">${ic('trophy','s')}${s.records.length}</span>`:''}${ic('right','s')}</button>`}

/* ---------- CALENDRIER ---------- */
function vCal(){
  const first=new Date(calY,calM,1),tk=dk(new Date());
  const start=addDays(first,-((first.getDay()+6)%7));
  let h=`<div class="row between" style="margin:2px 0 10px"><button class="ibtn" data-a="calNav" data-n="-1">${ic('left')}</button><b style="font-size:18px;text-transform:capitalize">${MOIS[calM]} ${calY}</b><button class="ibtn" data-a="calNav" data-n="1">${ic('right')}</button></div><div class="cal">`;
  WEEK.forEach(d=>h+=`<div class="hd">${JC[d]}</div>`);
  for(let i=0;i<42;i++){
    const day=addDays(start,i),k=dk(day),inM=day.getMonth()===calM;
    if(i>=35&&!inM)break;
    const ss=sessOn(k),t=planFor(k);let dots=ss.map(s=>`<i style="background:${s.color||'var(--ac)'}"></i>`).join('');
    if(!ss.length&&t)dots=k<tk?(k>=since()?'<i class="ms"></i>':''):`<i class="pl" style="border-color:${t.color}"></i>`;
    h+=`<button class="c ${inM?'':'out'} ${k===tk?'td':''}" data-a="calDay" data-k="${k}" style="${inM?'':'opacity:.35'}"><span class="num">${day.getDate()}</span><span class="ds">${dots}</span></button>`;
  }
  h+=`</div><div class="row tiny muted" style="gap:14px;margin:10px 4px 0;flex-wrap:wrap"><span class="row" style="gap:5px"><span class="dot" style="background:var(--ac)"></span>Faite</span><span class="row" style="gap:5px"><span class="dot" style="border:1.5px solid var(--tx3)"></span>Prévue</span><span class="row" style="gap:5px"><span class="dot" style="border:1.5px solid var(--red)"></span>Manquée</span></div>`;
  const ms=doneSess().filter(s=>{const d=fromDk(s.date);return d.getFullYear()===calY&&d.getMonth()===calM}).reverse();
  const vol=ms.reduce((a,s)=>a+sessVolume(s),0),dur=ms.reduce((a,s)=>a+(s.end-s.start),0);
  h+=`<div class="tiles" style="margin-top:16px"><div class="tile"><div class="small muted">Séances du mois</div><div class="v num">${ms.length}</div></div><div class="tile"><div class="small muted">Volume du mois${qm('volume')}</div><div class="v num">${fmtK(vol)}<small> kg</small></div></div></div>`;
  if(ms.length)h+=`<div class="h2">Séances du mois · ${fmtDur(dur)}</div><div class="card list">${ms.map(sessRow).join('')}</div>`;
  else h+=`<div class="empty">Aucune séance ce mois-ci.<br>Touche un jour pour en ajouter une.</div>`;
  return {sub:'Historique',title:'Calendrier',html:h};
}
function daySheet(k){
  const d=fromDk(k),dow=d.getDay(),tk=dk(new Date()),ss=sessOn(k);let scope='day';
  const body=openSheet('');
  const draw=()=>{
    const t=planFor(k),ov=S.planDates[k]!==undefined,wk=tplById(S.plan[dow]),cur=scope==='day'?(t?t.id:''):(wk?wk.id:'');
    let h=`<h3 style="text-transform:capitalize">${fmtDayLong(k)}</h3>`;
    if(ss.length)h+=`<div class="card list" style="background:var(--s2)">${ss.map(sessRow).join('')}</div>`;
    if(k<tk){
      if(t)h+=`<div class="small muted" style="margin:-6px 0 12px">Était prévu : <b style="color:${t.color}">${esc(t.name)}</b></div>`;
      if(!ss.length)h+=`<div class="muted small" style="margin-bottom:14px">Aucune séance enregistrée ce jour.</div>`;
      h+=`<button class="btn full" data-a="pickStart" data-k="${k}">${ic('plus','s')}Ajouter une séance ce jour</button>`;
    }else{
      if(k===tk)h+=`<button class="btn full" style="margin-bottom:14px" data-a="${t?'start':'pickStart'}" ${t?`data-id="${t.id}"`:`data-k="${k}"`}>${ic('play','s')}${t?'Commencer '+esc(t.name):'Démarrer une séance'}</button>`;
      h+=`<div class="h2" style="margin-top:4px">Séance prévue</div>`;
      h+=`<div class="seg" style="margin-top:0"><button data-x="sc" data-s="day" class="${scope==='day'?'on':''}">Ce jour uniquement</button><button data-x="sc" data-s="week" class="${scope==='week'?'on':''}">Chaque ${JOURS[dow]}</button></div>`;
      h+=S.templates.map(x=>`<button class="opt ${cur===x.id?'on':''}" data-x="pl" data-id="${x.id}"><span class="dot" style="background:${x.color};width:12px;height:12px"></span><div class="grow"><div style="font-weight:600">${esc(x.name)}</div><div class="small muted">${x.items.length} exercices · ~${tplMinutes(x)} min</div></div>${cur===x.id?`<span style="color:var(--ac)">${ic('check')}</span>`:''}</button>`).join('');
      h+=`<button class="opt ${!cur?'on':''}" data-x="pl" data-id=""><span class="dot" style="background:var(--s3);width:12px;height:12px"></span><div class="grow" style="font-weight:600">Repos</div>${!cur?`<span style="color:var(--ac)">${ic('check')}</span>`:''}</button>`;
      h+=`<div class="tiny dim" style="margin:2px 4px 12px">${scope==='day'?(ov?`Prévu pour ce jour uniquement. Habituellement le ${JOURS[dow]} : ${wk?esc(wk.name):'repos'}.`:`Choisis une séance pour ce jour seulement. Le reste de ton planning ne change pas.`):`S’applique à tous les ${JOURS[dow]}s, sauf les jours prévus à part.`}</div>`;
      if(ov&&scope==='day')h+=`<button class="btn full sec" data-x="reset">Revenir au planning habituel</button>`;
      h+=`<button class="btn ghost full" style="margin-top:10px" data-x="new">${ic('plus','s')}Créer une séance type</button>`;
    }
    const st=body.scrollTop;body.innerHTML=h;body.scrollTop=st;
  };
  draw();
  body.addEventListener('click',e=>{const x=e.target.closest('[data-x]');if(!x)return;const a=x.dataset.x;
    if(a==='sc'){scope=x.dataset.s;draw();return}
    if(a==='new'){closeSheet();tplEditor();return}
    if(a==='reset'){delete S.planDates[k];save('planDates');closeSheet();render();toast('Planning habituel rétabli pour ce jour');return}
    if(a==='pl'){const id=x.dataset.id||null,t=tplById(id),lab=t?t.name:'Repos';
      if(scope==='week'){S.plan[dow]=id;save('plan');stampPlan('w',dow);toast(`Chaque ${JOURS[dow]} : ${lab}`)}
      else{const wk=S.plan[dow]||null;if((id||null)===(tplById(wk)?wk:null))delete S.planDates[k];else S.planDates[k]=id||'rest';save('planDates');stampPlan('d',k);toast(`${fmtDay(k)} : ${lab}`)}
      closeSheet();render()}
  });
}

function exFiltered(f,q){
  q=(q||'').trim().toLowerCase();const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  return S.exercises.filter(e=>(f==='Tous'||(f==='Perso'?e.custom:e.muscle===f))&&(!q||norm(e.name).includes(norm(q))||norm(e.muscle).includes(norm(q)))).sort((a,b)=>MUSCLES.indexOf(a.muscle)-MUSCLES.indexOf(b.muscle)||a.name.localeCompare(b.name,'fr'));
}
function exListHtml(){
  const L=exFiltered(exFilter,exSearch);if(!L.length)return `<div class="empty">Aucun exercice trouvé.</div>`;
  let h='',cur='';
  L.forEach(e=>{if(e.muscle!==cur){if(cur)h+='</div>';cur=e.muscle;h+=`<div class="h2">${esc(cur)}</div><div class="card list tight">`}
    h+=`<button class="li" style="width:100%;text-align:left" data-a="exSheet" data-id="${e.id}"><div class="grow"><div style="font-weight:550">${esc(e.name)} ${e.custom?'<span class="badge">Perso</span>':''}</div><div class="small muted">${esc(e.equip)} · ${TYPES[e.type]}</div></div>${ic('right','s')}</button>`});

function exPicker(onPick,multi=true){

    <div class="chips">${['Tous','Perso',...MUSCLES].map(m=>`<button class="chip ${f===m?'on':''}" data-x="f" data-m="${esc(m)}">${esc(m)}</button>`).join('')}</div>

  };
  draw();
  body.addEventListener('input',ev=>{if(ev.target.id==='pq'){q=ev.target.value;const pos=ev.target.selectionStart;draw();const i=$('#pq',body);i.focus();try{i.setSelectionRange(pos,pos)}catch(e){}}});
  body.addEventListener('click',ev=>{const x=ev.target.closest('[data-x]');if(!x)return;const a=x.dataset.x;
    if(a==='f'){f=x.dataset.m;draw()}
    if(a==='p'){const id=x.dataset.id;if(!multi){closeSheet();onPick([id]);return}sel.has(id)?sel.delete(id):sel.add(id);const st=body.scrollTop;draw();body.scrollTop=st}

/* ---------- PROGRÈS ---------- */
function vProg(){
  let h=`<div class="seg"><button class="${progSeg==='week'?'on':''}" data-a="pseg" data-s="week">Semaine</button><button class="${progSeg==='rec'?'on':''}" data-a="pseg" data-s="rec">Records</button><button class="${progSeg==='curve'?'on':''}" data-a="pseg" data-s="curve">Courbes</button></div>`;
  if(progSeg==='week')h+=vWeek();else if(progSeg==='rec')h+=vRecords();else h+=vCurves();
  return {sub:'Statistiques',title:'Progrès',html:h};
}
function weekData(ws){
  const we=addDays(ws,7),ss=S.sessions.filter(s=>s.done&&fromDk(s.date)>=ws&&fromDk(s.date)<we);
  const mus={};let sets=0,vol=0,dur=0;
  ss.forEach(s=>{dur+=s.end-s.start;s.items.forEach(i=>{const e=exById(i.exId),m=(e&&e.muscle)||i.muscle||'Autre',ty=exType(i);i.sets.forEach(x=>{if(!x.done)return;sets++;mus[m]=mus[m]||{sets:0,vol:0};mus[m].sets++;if(ty==='charge'){const v=(x.w||0)*(x.r||0);vol+=v;mus[m].vol+=v}})})});
  return {ss,mus,sets,vol,dur};
}
function vWeek(){
  const ws=addDays(weekStart(new Date()),7*weekOff),we=addDays(ws,6);

  const diff=(a,b,u='')=>{if(!b)return '';const p=Math.round((a-b)/b*100);return `<div class="tiny" style="color:${p>=0?'var(--ok)':'var(--red)'}">${p>=0?'+':''}${p} % vs sem. préc.</div>`};

  h+=`<div class="tiles"><div class="tile"><div class="small muted">Séances</div><div class="v num">${W.ss.length}</div>${diff(W.ss.length,P.ss.length)}</div><div class="tile"><div class="small muted">Durée</div><div class="v num" style="font-size:20px">${fmtDur(W.dur)}</div>${diff(W.dur,P.dur)}</div><div class="tile"><div class="small muted">Séries</div><div class="v num">${W.sets}</div>${diff(W.sets,P.sets)}</div><div class="tile"><div class="small muted">Volume${qm('volume')}</div><div class="v num" style="font-size:20px">${fmtK(W.vol)}<small> kg</small></div>${diff(W.vol,P.vol)}</div></div>`;
  const ms=Object.entries(W.mus).sort((a,b)=>b[1].sets-a[1].sets);

    h+=`<div class="h2">Séries par groupe musculaire</div><div class="card bars">`+ms.map(([m,v])=>{const pv=(P.mus[m]||{}).sets||0;return `<div class="b"><div class="row between small"><span>${esc(m)}</span><span class="num muted">${v.sets} séries${v.vol?' · '+fmtK(v.vol)+' kg':''}${pv?` <span class="dim">(${pv})</span>`:''}</span></div><div class="track"><div class="fill" style="width:${v.sets/mx*100}%"></div></div></div>`}).join('')+`<div class="tiny dim" style="margin-top:8px">Entre parenthèses : la semaine précédente.</div></div>`;

  o+=`<div class="h2">Séances (${h.length})</div><div class="card list">`+h.slice().reverse().slice(0,15).map(x=>`<div class="li"><div class="grow"><div class="small" style="font-weight:600">${fmtDay(x.s.date)} · ${esc(x.s.name)}</div><div class="small muted">${x.sets.map(s=>setTxt(e.type,s)).join('  ·  ')}</div></div><b class="num small">${fmtMetric(e.type,progM,metric(e.type,x.sets,progM))}</b></div>`).join('')+`</div>`;

function lineChart(pts,type,m){
  const W=340,H=170,L=40,R=10,T=12,B=24;
  if(!pts.length)return '';
  const ys=pts.map(p=>p.y);let mn=Math.min(...ys),mx=Math.max(...ys);if(mn===mx){mn=mn*0.9;mx=mx*1.1||1}const pd=(mx-mn)*.12;mn=Math.max(0,mn-pd);mx+=pd;
  const xs=pts.map(p=>p.x),x0=Math.min(...xs),x1=Math.max(...xs);
  const X=v=>pts.length===1?L+(W-L-R)/2:L+(v-x0)/(x1-x0)*(W-L-R),Y=v=>T+(1-(v-mn)/(mx-mn))*(H-T-B);
  const lab=v=>type==='temps'?fmtSec(v):(Math.abs(v)>=1000?Math.round(v/100)/10+'k':fmtN(Math.round(v*10)/10));
  let g='';for(let i=0;i<4;i++){const v=mn+(mx-mn)*i/3,y=Y(v);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y+4}" fill="var(--tx3)" font-size="10" text-anchor="end">${lab(v)}</text>`}
  const path=pts.map((p,i)=>(i?'L':'M')+X(p.x).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');
  const area=pts.length>1?`<path d="${path} L${X(x1).toFixed(1)} ${H-B} L${X(x0).toFixed(1)} ${H-B} Z" fill="var(--acbg)"/>`:'';
  const d=t=>{const x=new Date(t);return x.getDate()+' '+MC[x.getMonth()]};
  const lastp=pts[pts.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}${area}<path d="${path}" fill="none" stroke="var(--ac)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${pts.length<=40?pts.map(p=>`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="3" fill="var(--bg)" stroke="var(--ac)" stroke-width="2"/>`).join(''):''}<circle cx="${X(lastp.x)}" cy="${Y(lastp.y)}" r="5" fill="var(--ac)"/><text x="${L}" y="${H-6}" fill="var(--tx3)" font-size="10">${d(x0)}</text>${pts.length>1?`<text x="${W-R}" y="${H-6}" fill="var(--tx3)" font-size="10" text-anchor="end">${d(x1)}</text>`:''}</svg>`;
}

    let side=(t-bar)/2;const res=[];
    if(side>=0)for(const p of [...avail].sort((a,b)=>b-a)){while(side>=p-1e-9){res.push(p);side=Math.round((side-p)*1000)/1000}}
    const ok=t>=bar;
    const one=p=>`<div class="pl" style="height:${M.ht[p]||50}px;background:${M.col[p]||'#7c7c8a'}"><span style="color:${light(M.col[p])?'#222':'#fff'}">${fmtN(p)}</span></div>`;
    const conv=u==='lb'?`= ${fmtN(Math.round(t*LB*10)/10)} kg`:`= ${fmtN(Math.round(t/LB*10)/10)} lb`;
    body.innerHTML=`<h3>Calculateur de disques</h3>
    <div class="seg" style="margin-top:0">${['kg','lb'].map(x=>`<button data-x="u" data-u="${x}" class="${u===x?'on':''}">${x==='kg'?'Kilos (kg)':'Livres (lb)'}</button>`).join('')}</div>
    <div class="row" style="gap:8px"><button class="ibtn" data-x="m" style="width:46px;height:46px">${ic('minus')}</button><input id="pt" inputmode="decimal" value="${fmtN(t)}" style="text-align:center;font-size:24px;font-weight:700;height:46px"><button class="ibtn" data-x="p" style="width:46px;height:46px">${ic('plus')}</button></div>
    <div class="small muted num" style="text-align:center;margin-top:6px">${conv}</div>
    <div class="chips" style="margin-top:10px">${M.bars.map(b=>`<button class="chip ${bar==b?'on':''}" data-x="b" data-b="${b}">${b?'Barre '+b+' '+u:'Sans barre'}</button>`).join('')}</div>
    ${ok?`<div class="plates">${res.slice().reverse().map(one).join('')}<div class="bar" style="width:${bar?60:20}px"></div>${res.map(one).join('')}</div>
    <div style="text-align:center;font-size:17px"><b>${res.length?'Par côté : '+res.map(fmtN).join(' + ')+' '+u:'Barre seule'}</b></div>
    ${side>0.001?`<div class="small" style="text-align:center;color:var(--gold);margin-top:6px">Impossible à faire exactement : il manque ${fmtN(side*2)} ${u} au total</div>`:''}`:`<div class="empty">La charge est inférieure au poids de la barre.</div>`}
    <div class="tiny dim" style="text-align:center;margin-top:12px">${u==='lb'?'Disques en livres : 45, 35, 25, 10, 5 et 2,5 lb.':'Disques disponibles modifiables dans Réglages.'}</div>`;
  };
  draw();
  const step=()=>u==='lb'?5:2.5;
  body.addEventListener('change',e=>{if(e.target.id==='pt'){t=num(e.target.value)||0;draw()}});
  body.addEventListener('click',e=>{const x=e.target.closest('[data-x]');if(!x)return;
    if(x.dataset.x==='m'){t=Math.max(0,(num($('#pt',body).value)??t)-step());draw()}
    if(x.dataset.x==='p'){t=(num($('#pt',body).value)??t)+step();draw()}
    if(x.dataset.x==='b'){bar=+x.dataset.b;draw()}
    if(x.dataset.x==='u'&&x.dataset.u!==u){u=x.dataset.u;t=u==='lb'?Math.round(t/LB/5)*5:Math.round(t*LB/2.5)*2.5;bar=u==='lb'?S.settings.barLb:S.settings.bar;draw()}
  });
}

  return {exId,exName:e.name,type,muscle:e.muscle,unit:S.settings.unit||'kg',skipped:false,skipLast:lastStatus(exId,tplId,before,excl),tgt:t.reps||null,rest:t.rest??S.settings.rest,ss:!!t.ss,sets,prev:pv?pv.sets:null,prevDate:pv?pv.date:null};

function createSession(tplId,dayK){

  if(t)s.items=t.items.filter(i=>exById(i.exId)).map(i=>makeItem(i.exId,i,t.id,start,s.id));

function addToLive(){exPicker(ids=>{ids.forEach(id=>L.items.push(makeItem(id,{sets:3,reps:null,rest:S.settings.rest},L.templateId,L.start,L.id)));saveLive(true);renderLive();setTimeout(()=>{const b=$('#live .lv-b');b.scrollTop=b.scrollHeight},50)})}
function keyField(ty){return ty==='charge'||ty==='reps'?'r':ty==='temps'?'t':'d'}
function checkPR(i,k){
  const it=L.items[i],ty=it.type||exType(it),x=it.sets[k],prior=[];
  S.sessions.forEach(s=>{if(s.done&&s.id!==L.id)s.items.forEach(j=>{if(j.exId===it.exId)j.sets.forEach(y=>{if(y.done)prior.push(y)})})});
  L.items.forEach((j,ii)=>{if(j.exId===it.exId)j.sets.forEach((y,kk)=>{if(y.done&&!(ii===i&&kk===k))prior.push(y)})});
  if(!prior.length)return null;
  if(ty==='charge'){const mw=Math.max(...prior.map(y=>y.w||0)),me=Math.max(...prior.map(y=>e1rm(y.w,y.r)));
    if((x.w||0)>mw+1e-9&&x.r>0)return 'Record de charge';if(e1rm(x.w,x.r)>me+0.05)return 'Record 1RM estimé';return null}
  const f=keyField(ty),m=Math.max(...prior.map(y=>y[f]||0));
  if((x[f]||0)>m+1e-9)return ty==='reps'?'Record de répétitions':ty==='temps'?'Record de durée':'Record de distance';
  return null;
}
function afterSet(i){
